services:
  pharmacy-pos:
    build: .
    container_name: pharmacy-pos
    restart: always
    ports:
      - "8787:8787"
    environment:
      - MOBILE_HOST=0.0.0.0
      - MOBILE_PORT=8787
      - MOBILE_DB=/app/data/inventory.sqlite3
      - MOBILE_ORIGINS=https://pharmacy-pos.ellahabad.workers.dev,http://localhost:5173,http://127.0.0.1:5173,http://150.230.52.29:8787,http://150.230.52.29,http://localhost:8787,http://127.0.0.1:8787
    volumes:
      - pharmacy-pos-data:/app/data

volumes:
  pharmacy-pos-data:
    name: pharmacy-pos-data
