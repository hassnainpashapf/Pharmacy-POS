/* 00_helpers.js — global utilities. Loaded first. */
(function(){
'use strict';
const G = window;

/* ---------- element builder ---------- */
function h(tag, attrs, ...children){
  const el = document.createElement(tag);
  if(attrs) for(const k in attrs){
    const v = attrs[k];
    if(v==null) continue;
    if(k==='class') el.className=v;
    else if(k==='html') el.innerHTML=v;
    else if(k.startsWith('on')&&typeof v==='function') el.addEventListener(k.slice(2),v);
    else if(k==='value') el.value=v;
    else el.setAttribute(k,v);
  }
  for(const c of children.flat(9)){
    if(c==null||c===false) continue;
    el.append(c.nodeType?c:document.createTextNode(String(c)));
  }
  return el;
}
function esc(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------- formatting ---------- */
const CUR = ()=>'PKR';
function fmt(n){ n=Number(n)||0; return 'Rs '+n.toLocaleString('en-PK',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtNum(n){ return (Number(n)||0).toLocaleString('en-PK'); }
function fmtDate(iso){ if(!iso) return '—'; const d=new Date(iso); return isNaN(d)?String(iso):d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
function fmtDateTime(iso){ if(!iso) return '—'; const d=new Date(iso); return isNaN(d)?String(iso):d.toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function monthISO(){ return new Date().toISOString().slice(0,7); }
function daysUntil(iso){ if(!iso) return 99999; return Math.ceil((new Date(iso)-Date.now())/86400000); }

/* ---------- toast ---------- */
function toast(msg,type='info'){
  let wrap=document.getElementById('toasts');
  if(!wrap){ wrap=h('div',{id:'toasts',class:'fixed top-4 right-4 z-[9999] space-y-2'}); document.body.append(wrap); }
  const colors={info:'bg-slate-800',success:'bg-emerald-600',error:'bg-red-600',warn:'bg-amber-500'};
  const t=h('div',{class:`${colors[type]||colors.info} text-white px-4 py-2.5 rounded-lg shadow-lg text-sm max-w-sm animate-[slideIn_.2s_ease]`},msg);
  wrap.append(t); setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),320);},3200);
}

/* ---------- modal ---------- */
function modal(title, bodyHTML, opts={}){
  const ov=h('div',{class:'fixed inset-0 z-[9000] bg-black/50 flex items-center justify-center p-4'});
  const box=h('div',{class:`bg-white rounded-xl shadow-2xl w-full ${opts.wide?'max-w-4xl':'max-w-lg'} max-h-[92vh] flex flex-col`});
  const head=h('div',{class:'flex items-center justify-between px-5 py-4 border-b border-slate-200'},
    h('h3',{class:'font-semibold text-lg'},title),
    h('button',{class:'text-slate-400 hover:text-slate-700 text-2xl leading-none',onclick:()=>close()},'×'));
  const body=h('div',{class:'p-5 overflow-y-auto',html:bodyHTML});
  box.append(head,body); ov.append(box); document.body.append(ov);
  function close(){ ov.remove(); document.removeEventListener('keydown',onKey); }
  function onKey(e){ if(e.key==='Escape') close(); }
  document.addEventListener('keydown',onKey);
  ov.addEventListener('mousedown',e=>{ if(e.target===ov) close(); });
  return {el:body, box, close};
}
function confirmDlg(title,msg,okLabel='Confirm'){
  return new Promise(res=>{
    const m=modal(title,`<p class="text-slate-600 text-sm">${msg}</p>
      <div class="flex justify-end gap-2 mt-6">
        <button id="cNo" class="px-4 py-2 rounded-lg border border-slate-300 text-sm">Cancel</button>
        <button id="cYes" class="px-4 py-2 rounded-lg bg-red-600 text-white text-sm hover:bg-red-700">${esc(okLabel)}</button>
      </div>`);
    m.el.querySelector('#cNo').onclick=()=>{m.close();res(false);};
    m.el.querySelector('#cYes').onclick=()=>{m.close();res(true);};
  });
}

/* ---------- form helpers ---------- */
function formVal(root, name){ const el=root.querySelector(`[name="${name}"]`); return el?el.value.trim():''; }
function formNum(root, name){ return Number(formVal(root,name))||0; }
function collectForm(root){
  const o={}; root.querySelectorAll('[name]').forEach(el=>{
    if(el.type==='checkbox') o[el.name]=el.checked;
    else if(el.type==='number') o[el.name]=Number(el.value)||0;
    else o[el.name]=el.value.trim();
  }); return o;
}
function field(label,name,opts={}){
  const {type='text',value='',ph='',req=false,cls='',step,options,rows=3,min,max}=opts;
  let input;
  if(type==='select'){
    input=`<select name="${name}" class="border border-slate-300 rounded-lg px-3 py-2 w-full text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none ${cls}">${(options||[]).map(o=>`<option value="${esc(o.value)}" ${String(o.value)===String(value)?'selected':''}>${esc(o.label)}</option>`).join('')}</select>`;
  }else if(type==='textarea'){
    input=`<textarea name="${name}" rows="${rows}" placeholder="${esc(ph)}" class="border border-slate-300 rounded-lg px-3 py-2 w-full text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none ${cls}">${esc(value)}</textarea>`;
  }else if(type==='checkbox'){
    input=`<input type="checkbox" name="${name}" ${value?'checked':''} class="w-4 h-4 accent-emerald-600">`;
    return `<label class="flex items-center gap-2 text-sm ${cls}">${input}<span class="font-medium text-slate-600">${label}</span></label>`;
  }else{
    input=`<input type="${type}" name="${name}" value="${esc(value)}" ${ph?`placeholder="${esc(ph)}"`:''} ${req?'required':''} ${step?`step="${step}"`:''} ${min!=null?`min="${min}"`:''} ${max!=null?`max="${max}"`:''} class="border border-slate-300 rounded-lg px-3 py-2 w-full text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none ${cls}">`;
  }
  return `<label class="block ${cls}"><span class="block text-xs font-medium text-slate-600 mb-1">${label}${req?' <span class="text-red-500">*</span>':''}</span>${input}</label>`;
}

/* ---------- tables ---------- */
function tableHTML(cols, rows, opts={}){
  const tcls=opts.compact?'text-xs':'text-sm';
  return `<div class="overflow-x-auto rounded-xl border border-slate-200 bg-white">
    <table class="w-full ${tcls}">
      <thead class="bg-slate-50 text-slate-500 uppercase ${opts.compact?'text-[10px]':'text-xs'} sticky top-0">
        <tr>${cols.map(c=>`<th class="px-4 py-3 text-left font-semibold whitespace-nowrap ${c.num?'text-right':''}">${c.label}</th>`).join('')}</tr>
      </thead>
      <tbody>${rows.length?rows.map((r,i)=>`<tr class="border-t border-slate-100 hover:bg-slate-50">${cols.map(c=>{
        const v=typeof c.get==='function'?c.get(r,i):r[c.key];
        return `<td class="px-4 py-2.5 ${c.num?'text-right tabular-nums':''} ${c.cls||''}">${v??'—'}</td>`;
      }).join('')}</tr>`).join(''):`<tr><td colspan="${cols.length}" class="px-4 py-10 text-center text-slate-400">${opts.empty||'No records found'}</td></tr>`}</tbody>
    </table></div>`;
}
function statCard(label,value,sub='',accent='emerald'){

function pageHead(title, sub, actions=''){

const btnP='px-4 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium';

/* ---------- misc ---------- */
function debounce(fn,ms=300){ let t; return (...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms);}; }
function uid(p='x'){ return p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function dlCSV(filename, rows){
  if(!rows.length){ toast('Nothing to export','warn'); return; }
  const keys=Object.keys(rows[0]);
  const csv=[keys.join(',')].concat(rows.map(r=>keys.map(k=>`"${String(r[k]??'').replace(/"/g,'""')}"`).join(','))).join('\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download=filename; a.click();
}
function printHTML(html, title='Print'){
  const w=window.open('','_blank','width=900,height=700');
  w.document.write(`<html><head><title>${esc(title)}</title><style>

function waShare(phone, text){
  let p=String(phone||'').replace(/\D/g,'');

  window.open('https://wa.me/'+(p||'')+'?text='+encodeURIComponent(text),'_blank');

function levelUnits(med, level){ // level: carton|box|packet|unit → units per pack
  const pk=med.pack||{};
  return level==='carton'?(pk.carton||1):level==='box'?(pk.box||1):level==='packet'?(pk.packet||1):1;
}
function levelLabel(med, level, qty){
  const u=levelUnits(med,level);
  return `${qty} ${level}${qty>1?'s':''}${u>1?` (${qty*u} units)`:''}`;
}

/* ===== 01_adapter.js ===== */
/* 01_adapter.js — API.call(fnName, ...args) → Promise.
   Uses google.script.run when deployed in Apps Script, else the localStorage mock (MockAPI). */
(function(){
'use strict';

const isGAS = !!(window.google && google.script && google.script.run);

const API = {
  isGAS,
  call(fn, ...args){
    if(isGAS){
      // All server calls go through the __api dispatcher, which validates the
      // login token (CacheService) and routes to the matching API function.
      const userJson = JSON.stringify(Session.user||null);
      const argsJson = JSON.stringify(args);
      return new Promise((resolve,reject)=>{
        google.script.run
          .withSuccessHandler(r=>resolve(r))
          .withFailureHandler(e=>reject(new Error((e&&e.message)||'Server call failed')))
          .__api(fn, userJson, argsJson);
      });
    }
    // local mock path
    return new Promise((resolve,reject)=>{
      setTimeout(()=>{
        try{
          const f = MockAPI[fn];
          if(typeof f!=='function') throw new Error('Unknown API function: '+fn);
          resolve(f(...args));
        }catch(e){ reject(e instanceof Error?e:new Error(String(e))); }
      }, 30);
    });
  }
};

/* session */
const Session = {
  get user(){ try{return JSON.parse(localStorage.getItem('phrx_session')||'null');}catch(e){return null;} },
  set user(u){ u?localStorage.setItem('phrx_session',JSON.stringify(u)):localStorage.removeItem('phrx_session'); },
  get bootstrap(){ try{return JSON.parse(localStorage.getItem('phrx_bootstrap')||'null');}catch(e){return null;} },
  set bootstrap(b){ b?localStorage.setItem('phrx_bootstrap',JSON.stringify(b)):localStorage.removeItem('phrx_bootstrap'); },
  clear(){ localStorage.removeItem('phrx_session'); localStorage.removeItem('phrx_bootstrap'); }
};

function perm(module, action='view'){
  const b=Session.bootstrap;
  if(!b||!b.permissions) return false;
  const p=b.permissions[module];
  if(!p) return false;
  return !!p[action];
}

window.API=API; window.Session=Session; window.perm=perm;
})();

/* 02_mock.js — localStorage backend implementing the full API contract from SPEC.md.

(function(){
'use strict';
const KEY='phrx_db_v1';

const TABLES=['settings','users','permissions','medicines','batches','customers','suppliers',
'doctors','prescriptions','sales','saleItems','saleReturns','pos','poItems','grns','grnItems',
'purchaseReturns','supplierPayments','expenses','income','banks','employees','advances','payroll',
'stockAdjustments','paymentMethods'];

function blank(){ const o={}; TABLES.forEach(t=>o[t]=[]); return o; }
function load(){ try{ const d=JSON.parse(localStorage.getItem(KEY)); if(d&&d.users) return d; }catch(e){} return null; }
function save(db){ localStorage.setItem(KEY,JSON.stringify(db)); }
function db(){ let d=load(); if(!d){ d=seed(); save(d);} return d; }
function nextId(d, prefix, table){
  const rows=d[table]||[];
  let max=0;
  rows.forEach(r=>{ const m=String(r.id||'').match(new RegExp('^'+prefix+'-(\\d+)$')); if(m) max=Math.max(max,parseInt(m[1],10)); });
  return prefix+'-'+String(max+1).padStart(4,'0');
}
function sha(s){ // NOT secure — mock only; Code.gs uses Utilities.computeDigest
  let h1=0xdeadbeef,h2=0x41c6ce57;
  for(let i=0;i<s.length;i++){ const ch=s.charCodeAt(i); h1=Math.imul(h1^ch,2654435761); h2=Math.imul(h2^ch,1597334677); }
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (h2>>>0).toString(16)+(h1>>>0).toString(16);
}
function setting(d,k,fb){ const r=d.settings.find(s=>s.key===k); return r?r.value:fb; }
function medById(d,id){ return d.medicines.find(m=>m.id===id); }
function batchById(d,id){ return d.batches.find(b=>b.id===id); }
function stockOf(d, medId){ return d.batches.filter(b=>b.medicineId===medId).reduce((s,b)=>s+Number(b.qty||0),0); }
function fifoBatches(d, medId){ return d.batches.filter(b=>b.medicineId===medId&&b.qty>0).sort((a,b)=>new Date(a.expiry)-new Date(b.expiry)); }
function deduct(d, medId, units, preferredBatch){
  let need=units;
  const picked=[];
  const list = preferredBatch ? [batchById(d,preferredBatch)].filter(Boolean) : fifoBatches(d,medId);
  for(const b of list){
    if(need<=0) break;
    const take=Math.min(b.qty,need); b.qty-=take; need-=take;
    picked.push({batchId:b.id, qty:take, cost:b.cost});
  }
  if(need>0) throw new Error('Insufficient stock for '+(medById(d,medId)||{}).brand+' (short '+(need)+' units)');
  return picked;
}

function todayStr(){ return new Date().toISOString().slice(0,10); }
function levelU(med,level){ const p=med.pack||{}; return level==='carton'?(p.carton||1):level==='box'?(p.box||1):level==='packet'?(p.packet||1):1; }
function permMatrix(d,role){ const r=d.permissions.find(p=>p.role===role); return r?r.matrix:{}; }
function requireUser(){ const u=Session.user; if(!u) fail('Not logged in'); return u; }

const MockAPI = {
  /* ---------- auth ---------- */
  login(username,password){

    const user={id:u.id,name:u.name,username:u.username,role:u.role};

    Session.bootstrap=MockAPI.getBootstrap();
    return {user, token:'mock-'+Date.now()};
  },
  getBootstrap(){

  saveSettings(s){ const d=db(); requireUser();
    Object.keys(s).forEach(k=>{ if(k==='paymentMethods')return; const r=d.settings.find(x=>x.key===k); r?r.value=s[k]:d.settings.push({key:k,value:s[k]}); });
    if(s.paymentMethods) d.paymentMethods=s.paymentMethods;

  /* ---------- dashboard ---------- */
  getDashboard(){
    const d=db(); requireUser();
    const t=todayStr();
    const tsales=d.sales.filter(s=>s.date.slice(0,10)===t);
    const todaySales=tsales.reduce((s,x)=>s+Number(x.total||0),0);
    const monthSales=d.sales.filter(s=>s.date.slice(0,7)===t.slice(0,7)).reduce((s,x)=>s+Number(x.total||0),0);
    let cogs=0; tsales.forEach(s=>{ d.saleItems.filter(i=>i.saleId===s.id).forEach(i=>{ const b=batchById(d,i.batchId); cogs+=i.qty*levelU(medById(d,i.medicineId)||{},i.level)*((b&&b.cost)||0); }); });
    const alerts=MockAPI.getStockAlerts();
    const trend=[]; for(let i=13;i>=0;i--){ const dt=new Date(Date.now()-i*86400000).toISOString().slice(0,10);
      trend.push({d:dt,total:d.sales.filter(s=>s.date.slice(0,10)===dt).reduce((s,x)=>s+Number(x.total||0),0)}); }
    const byMed={}; d.saleItems.forEach(i=>{ const m=medById(d,i.medicineId); const k=m?m.brand:i.medicineId;
      byMed[k]=byMed[k]||{brand:k,qty:0,amount:0}; byMed[k].qty+=i.qty*levelU(m||{},i.level); byMed[k].amount+=Number(i.amount||0); });
    const pay={}; d.sales.forEach(s=>{ try{JSON.parse(s.payments||'[]').forEach(p=>pay[p.method]=(pay[p.method]||0)+Number(p.amount||0));}catch(e){} });
    return {kpis:{todaySales,todayProfit:todaySales-cogs,monthSales,
      lowStock:alerts.lowStock.length+alerts.outOfStock.length, nearExpiry:alerts.nearExpiry.length+alerts.expired.length,
      totalCustomers:d.customers.length-1,
      pendingDues:d.customers.reduce((s,c)=>s+Number(c.balance||0),0)+d.suppliers.reduce((s,x)=>s+Number(x.balance||0),0)},
      salesTrend:trend, topMeds:Object.values(byMed).sort((a,b)=>b.amount-a.amount).slice(0,8),
      paySplit:Object.keys(pay).map(k=>({method:k,total:pay[k]})), alerts};
  },

  /* ---------- medicines ---------- */
  listMedicines(q='',filters={}){
    const d=db(); requireUser();
    q=String(q).toLowerCase();
    return d.medicines.filter(m=>{
      if(q && !(m.brand+' '+m.generic+' '+m.manufacturer).toLowerCase().includes(q)) return false;
      if(filters.lowStock && stockOf(d,m.id)>=Number(m.reorderLevel||0)) return false;
      if(filters.controlled && !m.controlled) return false;
      return true;
    }).map(m=>({...m, stock:stockOf(d,m.id),
      nearExpiry:d.batches.some(b=>b.medicineId===m.id&&daysLeft(b.expiry)<=90&&b.qty>0)}));
  },
  saveMedicine(m){ const d=db(); requireUser();
    if(m.id){ const r=medById(d,m.id); if(!r) fail('Medicine not found'); Object.assign(r,m); }
    else { m.id=nextId(d,'MED','medicines'); d.medicines.push(m); }
    save(d); return m.id;
  },
  deleteMedicine(id){ const d=db(); requireUser();
    if(d.batches.some(b=>b.medicineId===id&&b.qty>0)) fail('Cannot delete: stock batches exist');
    d.medicines=d.medicines.filter(m=>m.id!==id); save(d); return true;
  },
  importMedicines(rows){ const d=db(); requireUser(); let added=0,updated=0; const errors=[];
    rows.forEach((r,i)=>{ try{
      if(!r.brand) throw new Error('missing brand');
      const ex=d.medicines.find(m=>m.brand.toLowerCase()===String(r.brand).toLowerCase());
      const m={generic:r.generic||'',brand:r.brand,manufacturer:r.manufacturer||'',strength:r.strength||'',form:r.form||'Tablet',
        hsn:r.hsn||'',gst:Number(r.gst)||0,rack:r.rack||'',controlled:/^(y|1|true)$/i.test(String(r.controlled||'')),
        storage:r.storage||'',reorderLevel:Number(r.reorderLevel)||50,rxRequired:/^(y|1|true)$/i.test(String(r.rxRequired||'')),
        pack:{carton:Number(r.carton)||1,box:Number(r.box)||1,packet:Number(r.packet)||1}};
      if(ex){ Object.assign(ex,m); updated++; } else { m.id=nextId(d,'MED','medicines'); d.medicines.push(m); added++; }
    }catch(e){ errors.push('Row '+(i+1)+': '+e.message); } });
    save(d); return {added,updated,errors};
  },

  /* ---------- batches / stock ---------- */
  listBatches(medicineId='',filters={}){ const d=db(); requireUser();
    return d.batches.filter(b=>(!medicineId||b.medicineId===medicineId)&&(filters.zero?true:b.qty>0))
      .map(b=>{const m=medById(d,b.medicineId);const s=d.suppliers.find(x=>x.id===b.supplierId);
        return {...b,brand:m?m.brand:'?',generic:m?m.generic:'',supplier:s?s.name:'',daysLeft:daysLeft(b.expiry)};})
      .sort((a,b)=>new Date(a.expiry)-new Date(b.expiry));
  },
  saveBatch(b){ const d=db(); requireUser();
    if(b.id){ const r=batchById(d,b.id); if(!r) fail('Batch not found'); Object.assign(r,b); }
    else { b.id=nextId(d,'B','batches'); d.batches.push(b); }

  adjustStock(items){ const d=db(); const u=requireUser();
    items.forEach(it=>{ const b=batchById(d,it.batchId); if(!b) fail('Batch not found');
      b.qty=Number(b.qty||0)+Number(it.qtyChange||0);
      d.stockAdjustments.push({id:nextId(d,'ADJ','stockAdjustments'),date:new Date().toISOString(),medicineId:b.medicineId,batchId:b.id,qtyChange:it.qtyChange,reason:it.reason||'Adjustment',userId:u.id});
    });
    save(d); return true;

  getStockAlerts(){ const d=db(); requireUser();
    const expired=[],nearExpiry=[],lowStock=[],outOfStock=[];
    d.batches.forEach(b=>{ if(b.qty<=0) return; const dl=daysLeft(b.expiry); const m=medById(d,b.medicineId);
      const row={...b,brand:m?m.brand:'?',daysLeft:dl};
      if(dl<0) expired.push(row); else if(dl<=90) nearExpiry.push(row); });
    d.medicines.forEach(m=>{ const s=stockOf(d,m.id);
      if(s<=0) outOfStock.push({...m,stock:s}); else if(s<=Number(m.reorderLevel||0)) lowStock.push({...m,stock:s}); });
    return {expired,nearExpiry:nearExpiry.sort((a,b)=>a.daysLeft-b.daysLeft),lowStock,outOfStock};
  },

  receiveGRN(g){ const d=db(); const u=requireUser();

  /* ---------- sales ---------- */
  createSale(p){ const d=db(); const u=requireUser();
    if(!p.items||!p.items.length) fail('Cart is empty');
    let subtotal=0; const saleId=nextId(d,'S','sales'); const now=new Date().toISOString();
    const saleItems=[];
    p.items.forEach(it=>{
      const med=medById(d,it.medicineId); if(!med) fail('Medicine not found');
      if(med.rxRequired && !(p.doctorId&&p.prescriptionId)) fail(med.brand+' requires a prescription (doctor + prescription)');
      const units=Number(it.qty)*levelU(med,it.level);
      const picked=deduct(d,it.medicineId,units,it.batchId||null);
      const rate=Number(it.rate), qty=Number(it.qty), disc=Number(it.discount||0);
      const amount=qty*rate-disc; subtotal+=amount;
      const b0=batchById(d,picked[0].batchId);
      saleItems.push({id:nextId(d,'SI','saleItems'),saleId,medicineId:med.id,batchId:b0?b0.id:'',level:it.level,qty,rate,discount:disc,amount});
    });
    const discount=Number(p.discount||0), tax=Number(p.tax||0);
    const total=subtotal-discount+tax;
    const payTotal=(p.payments||[]).reduce((s,x)=>s+Number(x.amount||0),0);
    const balance=Math.max(0,total-payTotal);
    const sale={id:saleId,date:now,customerId:p.customerId||'C-0001',doctorId:p.doctorId||'',prescriptionId:p.prescriptionId||'',
      subtotal,discount,tax,total,paid:payTotal,balance,
      payments:JSON.stringify(p.payments||[]),delivery:p.delivery?JSON.stringify(p.delivery):'',notes:p.notes||'',userId:u.id,status:'completed'};
    d.sales.push(sale); saleItems.forEach(i=>d.saleItems.push(i));
    const cust=d.customers.find(c=>c.id===sale.customerId);
    if(cust){ cust.balance=Number(cust.balance||0)+balance; cust.loyaltyPoints=Number(cust.loyaltyPoints||0)+Math.floor(total/100); }
    save(d); return sale;
  },
  listSales(f={}){ const d=db(); requireUser();

      (!f.from||s.date.slice(0,10)>=f.from)&&(!f.to||s.date.slice(0,10)<=f.to)&&

      .map(s=>{const c=d.customers.find(x=>x.id===s.customerId);return {...s,customer:c?c.name:'?'};})
      .sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,500);
  },
  getSale(id){ const d=db(); requireUser();
    const sale=d.sales.find(s=>s.id===id); if(!sale) fail('Sale not found');
    const items=d.saleItems.filter(i=>i.saleId===id).map(i=>{const m=medById(d,i.medicineId);return {...i,brand:m?m.brand:'?',generic:m?m.generic:''};});
    const customer=d.customers.find(c=>c.id===sale.customerId)||{};
    const returns=d.saleReturns.filter(r=>r.saleId===id);

  saleReturn(r){ const d=db(); const u=requireUser();
    const sale=d.sales.find(s=>s.id===r.saleId); if(!sale) fail('Sale not found');
    const id=nextId(d,'SR','saleReturns'); let refund=0;
    (r.items||[]).forEach(it=>{
      const si=d.saleItems.find(x=>x.id===it.saleItemId); if(!si) return;
      const med=medById(d,si.medicineId); const units=Number(it.qty)*levelU(med||{},si.level);
      refund+=Number(it.qty)*Number(si.rate);
      if(r.restockTo==='batch'&&si.batchId){ const b=batchById(d,si.batchId); if(b) b.qty+=units; }
      si.qty=Math.max(0,Number(si.qty)-Number(it.qty));
    });
    d.saleReturns.push({id,saleId:r.saleId,date:new Date().toISOString(),items:JSON.stringify(r.items),refund,restockTo:r.restockTo||'batch',reason:r.reason||'',userId:u.id});
    sale.paid=Math.max(0,Number(sale.paid)-refund); sale.total=Math.max(0,Number(sale.total)-refund);
    save(d); return {id,refund};
  },

  deleteCustomer(id){ const d=db(); requireUser();
    if(d.sales.some(s=>s.customerId===id)) fail('Cannot delete: sales history exists');
    d.customers=d.customers.filter(c=>c.id!==id); save(d); return true;
  },
  getCustomerHistory(id){ const d=db(); requireUser();
    const customer=d.customers.find(c=>c.id===id); if(!customer) fail('Customer not found');
    const sales=d.sales.filter(s=>s.customerId===id).sort((a,b)=>new Date(b.date)-new Date(a.date));
    const returns=d.saleReturns.filter(r=>sales.some(s=>s.id===r.saleId));
    const prescriptions=d.prescriptions.filter(p=>p.customerId===id);
    return {customer,sales,returns,prescriptions};
  },

  /* ---------- accounting ---------- */
  listExpenses(f={}){ const d=db(); requireUser();
    return d.expenses.filter(e=>(!f.from||e.date>=f.from)&&(!f.to||e.date<=f.to)).sort((a,b)=>b.date.localeCompare(a.date)); },
  saveExpense(e){ const d=db(); const u=requireUser();
    e.id=nextId(d,'EX','expenses'); e.userId=u.id; d.expenses.push(e); save(d); return e.id; },
  listIncome(f={}){ const d=db(); requireUser();
    return d.income.filter(e=>(!f.from||e.date>=f.from)&&(!f.to||e.date<=f.to)).sort((a,b)=>b.date.localeCompare(a.date)); },
  saveIncome(e){ const d=db(); const u=requireUser();
    e.id=nextId(d,'IN','income'); e.userId=u.id; d.income.push(e); save(d); return e.id; },
  listBanks(){ const d=db(); requireUser(); return d.banks; },
  saveBank(b){ const d=db(); requireUser();
    if(b.id) Object.assign(d.banks.find(x=>x.id===b.id)||{},b);
    else { b.id=nextId(d,'BK','banks'); d.banks.push(b); }
    save(d); return b.id;
  },
  getCashBook(from,to){ const d=db(); requireUser();
    const rows=[];
    d.sales.forEach(s=>{ try{JSON.parse(s.payments||'[]').forEach(p=>{ if(p.method==='Cash') rows.push({date:s.date.slice(0,10),desc:'Sale '+s.id,type:'in',amount:Number(p.amount)}); });}catch(e){} });
    d.expenses.forEach(e=>rows.push({date:e.date,desc:e.head+' — '+e.notes,type:'out',amount:Number(e.amount)}));
    d.income.forEach(e=>rows.push({date:e.date,desc:e.head+' — '+e.notes,type:'in',amount:Number(e.amount)}));
    d.supplierPayments.forEach(p=>rows.push({date:p.date,desc:'Supplier payment',type:'out',amount:Number(p.amount)}));
    const f=rows.filter(r=>(!from||r.date>=from)&&(!to||r.date<=to)).sort((a,b)=>a.date.localeCompare(b.date)||0);
    let bal=0; f.forEach(r=>{ bal+=r.type==='in'?r.amount:-r.amount; r.balance=bal; });
    return {rows:f,totalIn:f.filter(r=>r.type==='in').reduce((s,r)=>s+r.amount,0),totalOut:f.filter(r=>r.type==='out').reduce((s,r)=>s+r.amount,0)};
  },
  getProfitLoss(from,to){ const d=db(); requireUser();
    const inR=s=>!from||s.date.slice(0,10)>=from, inR2=s=>!to||s.date.slice(0,10)<=to;
    const sales=d.sales.filter(s=>inR(s)&&inR2(s));
    const rev=sales.reduce((s,x)=>s+Number(x.total||0),0);
    let cogs=0; sales.forEach(s=>d.saleItems.filter(i=>i.saleId===s.id).forEach(i=>{ const b=batchById(d,i.batchId); cogs+=i.qty*levelU(medById(d,i.medicineId)||{},i.level)*((b&&b.cost)||0); }));
    const exp=d.expenses.filter(e=>(!from||e.date>=from)&&(!to||e.date<=to));
    const inc=d.income.filter(e=>(!from||e.date>=from)&&(!to||e.date<=to)&&e.head!=='Customer Dues Collection');
    const byHead={}; exp.forEach(e=>byHead[e.head]=(byHead[e.head]||0)+Number(e.amount));
    const tExp=exp.reduce((s,e)=>s+Number(e.amount),0), tInc=inc.reduce((s,e)=>s+Number(e.amount),0);
    return {sales:rev,cogs,gross:rev-cogs,expenses:tExp,otherIncome:tInc,net:rev-cogs-tExp+tInc,byHead};
  },

  /* ---------- payroll ---------- */
  listEmployees(){ const d=db(); requireUser(); return d.employees; },
  saveEmployee(e){ const d=db(); requireUser();
    if(e.id) Object.assign(d.employees.find(x=>x.id===e.id)||{},e);
    else { e.id=nextId(d,'E','employees'); e.active=true; d.employees.push(e); }
    save(d); return e.id;
  },
  recordAdvance(a){ const d=db(); const u=requireUser();
    d.advances.push({id:nextId(d,'ADV','advances'),employeeId:a.employeeId,date:a.date||todayStr(),amount:Number(a.amount),notes:a.notes||'',userId:u.id});
    save(d); return true;
  },
  listAdvances(employeeId,month){ const d=db(); requireUser();
    return d.advances.filter(a=>a.employeeId===employeeId&&(!month||a.date.slice(0,7)===month)); },
  generatePayroll(m){ const d=db(); const u=requireUser();
    const month=(m&&typeof m==='object')?m.month:m;
    if(d.payroll.some(p=>p.month===month)) fail('Payroll for '+month+' already generated');
    const ids=[];
    d.employees.filter(e=>e.active).forEach(e=>{
      const adv=d.advances.filter(a=>a.employeeId===e.id&&a.date.slice(0,7)===month).reduce((s,a)=>s+Number(a.amount),0);
      const id=nextId(d,'PR','payroll');
      d.payroll.push({id,employeeId:e.id,month,salary:Number(e.salary),advances:adv,net:Number(e.salary)-adv,paid:false,date:todayStr(),userId:u.id});
      ids.push(id);
    });
    save(d); return ids;
  },
  listPayroll(month){ const d=db(); requireUser();
    return d.payroll.filter(p=>!month||p.month===month).map(p=>{const e=d.employees.find(x=>x.id===p.employeeId);return {...p,employee:e?e.name:'?'};}); },
  markPayrollPaid(id){ const d=db(); const u=requireUser();
    const p=d.payroll.find(x=>x.id===id); if(!p) fail('Not found'); p.paid=true;
    d.expenses.push({id:nextId(d,'EX','expenses'),date:todayStr(),head:'Salary',amount:p.net,notes:'Salary '+p.month+' ['+p.employeeId+']',userId:u.id});
    save(d); return true;
  },

  /* ---------- reports ---------- */
  reportSales(f){ const d=db(); requireUser();
    const sales=d.sales.filter(s=>(!f.from||s.date.slice(0,10)>=f.from)&&(!f.to||s.date.slice(0,10)<=f.to));
    const by={};
    if(f.groupBy==='medicine'){ d.saleItems.filter(i=>sales.some(s=>s.id===i.saleId)).forEach(i=>{ const m=medById(d,i.medicineId);
      const k=m?m.brand:i.medicineId; by[k]=by[k]||{label:k,qty:0,amount:0}; by[k].qty+=i.qty; by[k].amount+=Number(i.amount); }); }
    else if(f.groupBy==='user'){ sales.forEach(s=>{ const u2=d.users.find(x=>x.id===s.userId); const k=u2?u2.name:s.userId;
      by[k]=by[k]||{label:k,qty:0,amount:0}; by[k].qty++; by[k].amount+=Number(s.total); }); }
    else { sales.forEach(s=>{ const k=s.date.slice(0,10); by[k]=by[k]||{label:k,qty:0,amount:0}; by[k].qty++; by[k].amount+=Number(s.total); }); }
    const rows=Object.values(by).sort((a,b)=>a.label.localeCompare(b.label));
    return {rows,total:rows.reduce((s,r)=>s+r.amount,0),count:sales.length};
  },
  reportPurchases(f){ const d=db(); requireUser();
    const grns=d.grns.filter(g=>(!f.from||g.date>=f.from)&&(!f.to||g.date<=f.to));
    const rows=grns.map(g=>{const po=d.pos.find(p=>p.id===g.poId);const s=po&&d.suppliers.find(x=>x.id===po.supplierId);
      return {date:g.date,grn:g.id,po:g.poId,supplier:s?s.name:'?',invoice:g.invoiceNo,charges:g.charges,total:g.total};});
    return {rows,total:rows.reduce((s,r)=>s+r.total,0)};
  },
  reportInventory(){ const d=db(); requireUser();
    const rows=d.batches.filter(b=>b.qty>0).map(b=>{const m=medById(d,b.medicineId);
      return {brand:m?m.brand:'?',batch:b.batchNo,expiry:b.expiry,qty:b.qty,cost:b.cost,value:b.qty*b.cost,mrp:b.mrp};});
    return {rows,totalValue:rows.reduce((s,r)=>s+r.value,0),totalMRP:rows.reduce((s,r)=>s+r.qty*r.mrp,0)};
  },
  reportExpiry(days){ const d=db(); requireUser(); const a=MockAPI.getStockAlerts();
    return (days<0?a.expired:a.nearExpiry.filter(r=>r.daysLeft<=days)).map(r=>({...r})); },
  reportFastMovers(f){ const d=db(); requireUser();
    const sales=d.sales.filter(s=>(!f.from||s.date.slice(0,10)>=f.from)&&(!f.to||s.date.slice(0,10)<=f.to));
    const by={}; d.saleItems.filter(i=>sales.some(s=>s.id===i.saleId)).forEach(i=>{ const m=medById(d,i.medicineId);
      const k=m?m.brand:i.medicineId; by[k]=by[k]||{brand:k,units:0,amount:0}; by[k].units+=i.qty*levelU(m||{},i.level); by[k].amount+=Number(i.amount); });
    return Object.values(by).sort((a,b)=>b.units-a.units).slice(0,f.limit||20);
  },
  reportDues(){ const d=db(); requireUser();
    return {customers:d.customers.filter(c=>Number(c.balance)>0).map(c=>({name:c.name,phone:c.phone,balance:Number(c.balance)})),
      suppliers:d.suppliers.filter(s=>Number(s.balance)>0).map(s=>({name:s.name,phone:s.phone,balance:Number(s.balance)}))};
  },

  /* ---------- AI ---------- */
  aiAsk(question){ const d=db(); requireUser();
    const s={}; d.settings.forEach(x=>s[x.key]=x.value);
    const money=n=>'Rs '+(Number(n)||0).toLocaleString('en-PK',{minimumFractionDigits:2,maximumFractionDigits:2});
    if(!s.aiKey||s.aiProvider==='none'){
      const inv=MockAPI.reportInventory();
      return {answer:'Demo mode (no AI key configured in Settings). Quick stats — medicines: '+d.medicines.length+
        ', sales today: '+money(d.sales.filter(x=>x.date.slice(0,10)===todayStr()).reduce((a,x)=>a+x.total,0))+
        ', inventory value: '+money(inv.totalValue)+
        ', low stock items: '+MockAPI.getStockAlerts().lowStock.length+'. Add a Gemini API key in Settings → AI to enable live answers.'};
    }
    fail('AI provider call happens server-side in Code.gs; configure key in the deployed app.');
  }
};
function daysLeft(iso){ if(!iso) return 99999; return Math.ceil((new Date(iso)-Date.now())/86400000); }

})();

async function route(){
  const view=document.getElementById('view'); if(!view) return;
  renderNav();
  let hash=location.hash||'#/dashboard';
  const [pathQ]=[hash]; const qIdx=hash.indexOf('?');
  const path=qIdx>0?hash.slice(0,qIdx):hash;
  const params={}; if(qIdx>0) new URLSearchParams(hash.slice(qIdx+1)).forEach((v,k)=>params[k]=v);
  // match longest registered prefix
  const keys=Object.keys(App.routes).sort((a,b)=>b.length-a.length);
  const key=keys.find(k=>path===k||path.startsWith(k+'/'));
  view.innerHTML='<div class="space-y-3"><div class="h-8 bg-white rounded-xl animate-pulse"></div><div class="h-64 bg-white rounded-xl animate-pulse"></div></div>';
  try{
    if(key) await App.routes[key](view, params, path);
    else { view.innerHTML=pageHead('Not found','')+'<p class="text-slate-500">This page does not exist.</p>'; }
  }catch(e){
    console.error(e);
    view.innerHTML=pageHead('Error','')+`<div class="bg-red-50 border border-red-200 text-red-700 rounded-xl p-4 text-sm">${esc(e.message||'Something went wrong')}</div>`;
  }
  window.scrollTo(0,0);
}

async function boot(){
  if(!await ensureBootstrap()){ if(location.hash!=='#/login') location.hash='#/login'; loginPage(); return; }
  if(!document.getElementById('view')) shellHTML();
  const hsh=location.hash;
  if(hsh==='#/login'||!hsh) location.hash='#/dashboard';
  route();
}

window.addEventListener('hashchange',()=>{ if(Session.user) route(); });
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
else boot();
App.ICONS=ICONS;
})();

function daysBadge(daysLeft){
  if(daysLeft == null || daysLeft > 9999) return badge('—','slate');
  if(daysLeft < 0) return badge('Expired','red');
  if(daysLeft <= 2) return badge(daysLeft+'d left','red');
  if(daysLeft <= 30) return badge(daysLeft+'d left','amber');
  return badge(daysLeft+'d left','blue');
}

function normalizeAlerts(a){
  // Backend sends {expired,nearExpiry,lowStock,outOfStock}; older shape may be an array.
  if(!a) return {expired:[], nearExpiry:[], lowStock:[], outOfStock:[]};
  if(Array.isArray(a)){
    const expired=[], nearExpiry=[], lowStock=[], outOfStock=[];
    a.forEach(r=>{
      if(r.kind==='expired') expired.push(r);
      else if(r.kind==='outOfStock') outOfStock.push(r);
      else if(r.kind==='lowStock' || (r.stock!=null && r.reorderLevel!=null && Number(r.stock)<=Number(r.reorderLevel))) lowStock.push(r);
      else nearExpiry.push(r);
    });
    return {expired, nearExpiry, lowStock, outOfStock};
  }
  return {expired:a.expired||[], nearExpiry:a.nearExpiry||[], lowStock:a.lowStock||[], outOfStock:a.outOfStock||[]};
}

function drawTrend(canvasId, salesTrend){
  const c=document.getElementById(canvasId);
  if(!c || typeof Chart==='undefined') return;
  const pts=(salesTrend||[]).slice(-14);
  const labels=pts.map(p=>fmtDate(p.d).replace(/^0/,''));
  const data=pts.map(p=>Number(p.total)||0);
  new Chart(c,{
    type:'line',
    data:{labels, datasets:[{
      label:'Sales (Rs)', data,
      borderColor:'#059669', backgroundColor:'rgba(5,150,105,.12)',
      fill:true, tension:.35, pointRadius:3, pointBackgroundColor:'#059669', borderWidth:2
    }]},
    options:{responsive:true, maintainAspectRatio:false,
      plugins:{legend:{display:false}, tooltip:{callbacks:{label:ctx=>' Rs '+fmtNum(ctx.parsed.y)}}},
      scales:{y:{beginAtZero:true, ticks:{callback:v=>'Rs '+(v>=1000?(v/1000)+'k':v)}}, x:{grid:{display:false}}}}
  });
}

function drawPaySplit(canvasId, paySplit){
  const c=document.getElementById(canvasId);
  if(!c || typeof Chart==='undefined') return;
  const rows=paySplit||[];
  new Chart(c,{
    type:'doughnut',
    data:{labels:rows.map(r=>r.method||'Other'),
      datasets:[{data:rows.map(r=>Number(r.total)||0),
        backgroundColor:rows.map((_,i)=>PALETTE[i%PALETTE.length]), borderWidth:2, borderColor:'#fff'}]},
    options:{responsive:true, maintainAspectRatio:false, cutout:'62%',
      plugins:{legend:{position:'bottom', labels:{boxWidth:12, padding:12}}, tooltip:{callbacks:{label:ctx=>' '+ctx.label+': Rs '+fmtNum(ctx.parsed)}}}}
  });
}

function topMedsList(topMeds){
  const rows=(topMeds||[]).slice(0,8);
  if(!rows.length) return '<div class="py-8 text-center text-slate-400 text-sm">No sales yet</div>';
  const max=Math.max(...rows.map(r=>Number(r.amount)||0),1);
  return rows.map((r,i)=>{
    const pct=Math.round((Number(r.amount)||0)/max*100);
    return `<div class="mb-3">
      <div class="flex items-center justify-between text-sm mb-1">
        <span class="font-medium text-slate-700 truncate pr-2">${esc(r.brand||'—')}</span>
        <span class="text-xs text-slate-500 whitespace-nowrap">${fmtNum(r.qty)} sold · <span class="font-semibold text-slate-700">Rs ${fmtNum(r.amount)}</span></span>
      </div>
      <div class="h-2.5 bg-slate-100 rounded-full overflow-hidden">
        <div class="h-full rounded-full" style="width:${pct}%;background:${PALETTE[i%PALETTE.length]}"></div>
      </div>
    </div>`;
  }).join('');
}

/* 30_pos.js — POS Billing module. Two-column billing screen: product search + cart. */
(function(){
'use strict';

App.nav.push({group:'SALES', path:'#/pos', label:'POS Billing', icon:'pos', perm:'pos'});

/* ---------- module state ---------- */
let medCache = null;        // full medicine list (listMedicines '')
let batchCache = {};        // medicineId -> [batches]
let docCache = null;        // doctors list
let cart = [];              // [{key,medicineId,brand,generic,strength,form,pack,stock,rxRequired,batchId,level,qty,rate,discount}]
let holds = [];             // held carts
let S = freshBill();

function freshBill(){
  return { customer:{id:'C-0001', name:'Walk-in Customer'}, doctorId:'', prescriptionId:'',
           billDisc:0, tax:0, delOn:false, address:'', delPhone:'', delStatus:'pending', notes:'' };
}
const WALKIN = 'C-0001';

/* ---------- helpers ---------- */
function settings(){ const b=Session.bootstrap; return (b&&b.settings)||{}; }
function payMethods(){ const b=Session.bootstrap; return (b&&b.paymentMethods)||[{id:'cash',name:'Cash',type:'cash'}]; }
function medMRP(medId){
  const bs=batchCache[medId]||[];
  if(!bs.length) return 0;
  return Math.max.apply(null, bs.map(b=>Number(b.mrp)||0));
}
function lineUnits(line){
  const pk=(line&&line.pack)||{};
  return line.level==='carton'?(pk.carton||1):line.level==='box'?(pk.box||1):line.level==='packet'?(pk.packet||1):1;
}
function lineAmt(line){ return Number(line.qty||0)*Number(line.rate||0)-Number(line.discount||0); }
function subtotal(){ return cart.reduce((s,l)=>s+lineAmt(l),0); }
function grandTotal(){ return Math.max(0, subtotal()-Number(S.billDisc||0)+Number(S.tax||0)); }
function canCreate(){ return perm('pos','create'); }

function levelOptions(pack){
  const lv=[['unit','Unit'],['packet','Packet'],['box','Box'],['carton','Carton']];
  return lv.filter(([v])=>v==='unit'||((pack&&pack[v])||0)>1)
           .map(([v,label])=>({value:v,label:label+(v==='unit'?'':` (${fmtNum(pack[v])} units)`)}));
}

/* ---------- bootstrap data ---------- */
async function loadCatalog(){
  if(medCache) return;
  const [meds, batches] = await Promise.all([
    API.call('listMedicines',''),
    API.call('listBatches','').catch(()=>[])
  ]);
  medCache = meds||[];
  batchCache = {};
  (batches||[]).forEach(b=>{ (batchCache[b.medicineId]=batchCache[b.medicineId]||[]).push(b); });
}

/* ---------- main route ---------- */

function matches(m, q){
  q=String(q||'').trim().toLowerCase();
  if(!q) return true;
  return (m.brand+' '+m.generic+' '+m.manufacturer+' '+m.id+' '+(m.hsn||'')).toLowerCase().includes(q);
}
function renderGrid(el, q){
  const grid = el.querySelector('#posGrid'); if(!grid||!medCache) return;

/* ---------- cart ---------- */
function addToCart(med){
  if(!med) return;

  const b0 = bs.find(b=>Number(b.qty)>0)||bs[0];
  if(!bs.length) toast(`${med.brand}: no batches in stock — rate set to 0`,'warn');
  const level = 'unit';
  const existing = cart.find(l=>l.medicineId===med.id && l.level===level);
  if(existing){ existing.qty++; renderCart(); return; }
  cart.push({ key:uid('l'), medicineId:med.id, brand:med.brand, generic:med.generic||'',
    strength:med.strength||'', form:med.form||'', pack:med.pack||{},
    stock:Number(med.stock||0), rxRequired:!!med.rxRequired,
    batchId:b0?b0.id:'', level, qty:1, rate:b0?Number(b0.mrp||0):0, discount:0 });
  renderCart();
}

  box.querySelector('#holdBtn').onclick = holdCart;
  box.querySelector('#resumeBtn').onclick = resumeModal;
  loadDoctorsInto(box.querySelector('#docSel'));
  updateRxWarn(box);
}

function bindCartLines(box){
  cart.forEach(l=>{
    const row = box.querySelector(`[data-line="${l.key}"]`); if(!row) return;
    const q = sel=>row.querySelector(sel);
    q('.minus').onclick = ()=>{ l.qty=Math.max(1,Number(l.qty)-1); renderCart(); };
    q('.plus').onclick = ()=>{ l.qty=Number(l.qty)+1; renderCart(); };
    q('.qt').addEventListener('change', e=>{
      const v=Math.max(1,Math.floor(Number(e.target.value)||1));
      if(v*lineUnits(l) > l.stock){ toast(`Only ${fmtNum(l.stock)} units available for ${l.brand}`,'error'); renderCart(); return; }
      l.qty=v; renderCart();
    });
    q('.rt').addEventListener('change', e=>{ l.rate=Math.max(0,Number(e.target.value)||0); renderCart(); });
    q('.dc').addEventListener('change', e=>{ l.discount=Math.max(0,Number(e.target.value)||0); renderCart(); });
    q('.lv').addEventListener('change', e=>{
      l.level=e.target.value;
      if(l.qty*lineUnits(l) > l.stock) l.qty=Math.max(1,Math.floor(l.stock/lineUnits(l))||1);
      renderCart();
    });
    q('.rm').onclick = ()=>{ cart=cart.filter(x=>x.key!==l.key); renderCart(); };
  });
}

function updateRxWarn(box){
  const w = box.querySelector('#rxWarn');
  const need = cart.some(l=>l.rxRequired);
  w.innerHTML = need ? `<div class="mt-2 text-xs ${S.doctorId&&S.prescriptionId?'text-emerald-600':'text-violet-700 bg-violet-50 border border-violet-200 rounded-lg px-2 py-1.5'}">
    ${S.doctorId&&S.prescriptionId?'✓ Prescription attached':'⚠ This bill contains prescription-only medicines — select a doctor and prescription.'}</div>` : '';
}

/* ---------- doctors / prescriptions ---------- */
async function loadDoctorsInto(sel){
  if(!sel) return;
  try{
    if(!docCache) docCache = await API.call('listDoctors','');
    sel.innerHTML = '<option value="">— Select —</option>'+(docCache||[]).map(d=>`<option value="${esc(d.id)}" ${d.id===S.doctorId?'selected':''}>${esc(d.name)}${d.specialization?' — '+esc(d.specialization):''}</option>`).join('');
    sel.onchange = e=>{
      S.doctorId=e.target.value; S.prescriptionId='';
      const box=sel.closest('#posCart');
      const rxSel=box&&box.querySelector('#rxSel');
      if(rxSel) loadPrescriptionsInto(rxSel);
      if(box) updateRxWarn(box);
    };
  }catch(e){ /* non-fatal */ }
}
async function loadPrescriptionsInto(sel){
  if(!sel) return;
  try{
    const list = await API.call('listPrescriptions',{doctorId:S.doctorId||undefined, customerId:S.customer.id||undefined});
    sel.innerHTML = '<option value="">— Select —</option>'+(list||[]).map(p=>`<option value="${esc(p.id)}" ${p.id===S.prescriptionId?'selected':''}>${esc(p.id)} · ${fmtDate(p.date)}${p.validTill?' → '+fmtDate(p.validTill):''}</option>`).join('');
    sel.onchange = e=>{ S.prescriptionId=e.target.value; const box=sel.closest('#posCart'); box&&updateRxWarn(box); };
  }catch(e){ /* non-fatal */ }
}

/* ---------- customer pickers ---------- */
function customerModal(){

    <div id="clist" class="max-h-80 overflow-y-auto"></div>`);

          <div class="font-medium text-sm">${esc(c.name)}</div>
          <div class="text-xs text-slate-400">${esc(c.phone||'')} ${c.id===WALKIN?'· walk-in':''}</div></button>`).join('')

function quickAddCustomer(){
  const m = modal('Quick Add Customer', `
    <div class="space-y-3">${field('Name','name',{req:true,ph:'Customer name'})}${field('Phone','phone',{ph:'03xx-xxxxxxx'})}</div>

/* ---------- hold / resume ---------- */
function holdCart(){
  if(!cart.length){ toast('Cart is empty','warn'); return; }
  holds.push({ id:uid('H'), date:new Date().toISOString(), cart:JSON.parse(JSON.stringify(cart)), bill:JSON.parse(JSON.stringify(S)) });
  try{ localStorage.setItem('phrx_hold', JSON.stringify(holds)); }catch(e){}
  cart=[]; S=freshBill(); toast('Sale held','success'); renderCart();
}
function resumeModal(){
  if(!holds.length){ toast('No held sales','info'); return; }
  const m=modal('Held Sales', holds.map((hh,i)=>
    `<div class="flex items-center justify-between border-b border-slate-100 py-2.5">
      <div><div class="font-medium text-sm">Hold ${esc(hh.id)}</div>
      <div class="text-xs text-slate-400">${fmtDateTime(hh.date)} · ${hh.cart.length} items · ${esc(hh.bill.customer.name||'Walk-in Customer')}</div></div>
      <div class="flex gap-2">
        <button data-i="${i}" class="res ${btnP} !px-3 !py-1.5 !text-xs">Resume</button>
        <button data-i="${i}" class="del ${btnD} !px-3 !py-1.5 !text-xs">Delete</button>
      </div></div>`).join('')||'<div class="text-center text-slate-400 text-sm py-6">No held sales</div>');
  m.el.querySelectorAll('.res').forEach(b=>b.onclick=()=>{
    const hh=holds[Number(b.dataset.i)];
    if(cart.length){ toast('Finish or clear the current cart first','warn'); return; }
    cart=hh.cart; S=hh.bill; holds.splice(Number(b.dataset.i),1);
    try{ localStorage.setItem('phrx_hold', JSON.stringify(holds)); }catch(e){}
    m.close(); toast('Held sale resumed','success'); renderCart();
  });
  m.el.querySelectorAll('.del').forEach(b=>b.onclick=async()=>{
    if(await confirmDlg('Delete hold','Delete this held sale?','Delete')){
      holds.splice(Number(b.dataset.i),1);
      try{ localStorage.setItem('phrx_hold', JSON.stringify(holds)); }catch(e){}
      m.close(); resumeModal(); renderCart();
    }
  });
}

/* ---------- checkout / split payments ---------- */
function openCheckout(){
  if(!cart.length) return;
  if(!canCreate()){ toast('No permission to create sales','error'); return; }
  const needRx = cart.some(l=>l.rxRequired);
  if(needRx && !(S.doctorId && S.prescriptionId)){
    toast('Prescription required: select a doctor and a prescription first','error');
    const w=document.querySelector('#rxWarn'); if(w) w.scrollIntoView({behavior:'smooth',block:'center'});
    return;
  }
  const methods = payMethods();
  const total = grandTotal();
  const m = modal('Checkout — '+fmt(total), `
    <div class="text-sm text-slate-500 mb-3">Enter amounts per payment method. Underpayment is allowed only for a registered customer (creates dues).</div>
    <div id="payRows" class="space-y-2">${methods.map(pm=>
      `<div class="flex items-center gap-3"><div class="w-32 text-sm font-medium">${esc(pm.name)}</div>
       <input type="number" min="0" step="0.01" data-mid="${esc(pm.id)}" data-mname="${esc(pm.name)}" class="payAmt border border-slate-300 rounded-lg px-3 py-2 text-sm w-full tabular-nums" placeholder="0.00"></div>`).join('')}</div>
    <div class="flex justify-between items-center mt-4 text-sm">
      <button id="fillRem" class="${btnS} !py-1.5 !text-xs">Fill remaining</button>
      <div>Paid: <span id="paidT" class="font-bold">Rs 0.00</span> · Balance: <span id="remT" class="font-bold">${fmt(total)}</span></div>
    </div>
    <div class="flex justify-end gap-2 mt-6">
      <button id="coCancel" class="${btnS}">Cancel</button>
      <button id="coConfirm" class="${btnP}">Confirm Sale</button>
    </div>`, {wide:false});
  const paidTotal=()=>Array.from(m.el.querySelectorAll('.payAmt')).reduce((s,i)=>s+(Number(i.value)||0),0);
  const refresh=()=>{
    const p=paidTotal();
    m.el.querySelector('#paidT').textContent=fmt(p);
    const r=total-p;
    m.el.querySelector('#remT').textContent=(r<0?'+ ':'')+fmt(Math.abs(r))+(r<0?' over':'');
    m.el.querySelector('#remT').className='font-bold '+(r<0?'text-amber-600':r===0?'text-emerald-600':'text-red-600');
  };
  m.el.querySelectorAll('.payAmt').forEach(i=>i.addEventListener('input',refresh));
  m.el.querySelector('#fillRem').onclick=()=>{
    const rem=total-paidTotal();
    if(rem<=0){ toast('Nothing remaining','info'); return; }
    const first=[...m.el.querySelectorAll('.payAmt')].find(i=>!Number(i.value));
    (first||m.el.querySelector('.payAmt')).value=(Number((first||m.el.querySelector('.payAmt')).value)||0)+rem;
    refresh();
  };
  m.el.querySelector('#coCancel').onclick=m.close;
  m.el.querySelector('#coConfirm').onclick=async()=>{
    const payments=Array.from(m.el.querySelectorAll('.payAmt'))
      .map(i=>({method:i.dataset.mname, amount:Number(i.value)||0})).filter(p=>p.amount>0);
    const paid=paidTotal();
    if(paid<total && S.customer.id===WALKIN){ toast('Walk-in customer must pay in full','error'); return; }
    if(paid<=0 && total>0){ toast('Enter at least one payment','error'); return; }
    const btn=m.el.querySelector('#coConfirm');
    btn.disabled=true; btn.textContent='Saving…';
    const payload={
      customerId:S.customer.id, doctorId:S.doctorId||undefined, prescriptionId:S.prescriptionId||undefined,
      items:cart.map(l=>({medicineId:l.medicineId, batchId:l.batchId||undefined, level:l.level, qty:l.qty, rate:l.rate, discount:l.discount})),
      discount:S.billDisc||0, tax:S.tax||0, payments, notes:S.notes||'',
      delivery:S.delOn?{address:S.address, phone:S.delPhone, status:S.delStatus}:undefined
    };
    try{
      const sale=await API.call('createSale', payload);
      m.close();
      const saleId = sale.id || sale.saleId || sale;
      cart=[]; S=freshBill(); docCache=null;
      renderCart();
      // refresh stock (catalog) in background, then repaint the product grid
      const keep=medCache;
      medCache=null; batchCache={};
      loadCatalog().then(()=>{
        const qEl=document.getElementById('posSearch');
        renderGrid(document.body, qEl?qEl.value:'');
      }).catch(()=>{ medCache=keep; });
      receiptModal(saleId);
    }catch(e){
      btn.disabled=false; btn.textContent='Confirm Sale';
      toast(e.message||'Sale failed','error');
    }
  };
}

/* ---------- receipt ---------- */
function receiptHTML(sale, items, customer, doctor){
  const st=settings();

  const store=st.storeName||'Pharmacy';
  const rows=items.map((it,i)=>{
    const batch=it.batchNo||it.batchId||'';
    return `<tr><td>${i+1}</td><td>${esc(it.brand||'')}<br><small>${esc(it.generic||'')}</small></td>
      <td class="c">${esc(batch)}</td><td class="c">${esc(it.level||'unit')} × ${fmtNum(it.qty)}</td>
      <td class="r">${fmt(it.rate)}</td><td class="r">${fmt(it.amount)}</td></tr>`;
  }).join('');
  let payments=[];
  try{ payments=JSON.parse(sale.payments||'[]'); }catch(e){}
  return `
  <div style="max-width:${st.printSize==='A4'?'700px':'280px'};margin:0 auto;font-family:Arial,sans-serif;color:#111">
    <div style="text-align:center;margin-bottom:10px">
      <div style="font-size:18px;font-weight:bold">${esc(store)}</div>
      <div style="font-size:11px">${esc(st.address||'')}${st.phone?' · '+esc(st.phone):''}</div>
    </div>
    <div style="font-size:11px;border-top:1px dashed #999;border-bottom:1px dashed #999;padding:6px 0;margin-bottom:8px">
      <div>Receipt: <b>${esc(sale.id)}</b> · ${fmtDateTime(sale.date)}</div>
      <div>Customer: <b>${esc(customer.name||'Walk-in Customer')}</b>${customer.phone?' · '+esc(customer.phone):''}</div>
      ${sale.doctorId?`<div>Doctor: ${esc(doctor&&doctor.name||sale.doctorId)}</div>`:''}
    </div>
    <table style="width:100%;border-collapse:collapse;font-size:11px">
      <thead><tr style="border-bottom:1px solid #999"><th style="text-align:left">#</th><th style="text-align:left">Item</th><th>Batch</th><th>Qty</th><th style="text-align:right">Rate</th><th style="text-align:right">Amount</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div style="border-top:1px dashed #999;margin-top:8px;padding-top:6px;font-size:12px">
      <div style="display:flex;justify-content:space-between"><span>Subtotal</span><span>${fmt(sale.subtotal)}</span></div>
      <div style="display:flex;justify-content:space-between"><span>Discount</span><span>− ${fmt(sale.discount)}</span></div>
      <div style="display:flex;justify-content:space-between"><span>Tax</span><span>+ ${fmt(sale.tax)}</span></div>
      <div style="display:flex;justify-content:space-between;font-weight:bold;font-size:14px"><span>Total</span><span>${fmt(sale.total)}</span></div>
      ${payments.map(p=>`<div style="display:flex;justify-content:space-between;font-size:11px"><span>Paid (${esc(p.method)})</span><span>${fmt(p.amount)}</span></div>`).join('')}
      ${Number(sale.balance||0)>0?`<div style="display:flex;justify-content:space-between;font-size:12px;color:#b45309"><span>Balance due</span><span>${fmt(sale.balance)}</span></div>`:''}
    </div>
    <div style="text-align:center;font-size:11px;margin-top:10px">${esc(st.receiptFooter||'Thank you for your visit!')}</div>
  </div>`;
}

function receiptModal(saleId){
  const m=modal('Sale completed', `<div class="text-center py-6"><div class="text-4xl mb-3">✅</div>
    <div class="font-semibold">Sale ${esc(saleId)} saved</div><div class="text-sm text-slate-500 mt-1">Loading receipt…</div></div>`);
  API.call('getSale', saleId).then(({sale,items,customer})=>{
    m.el.innerHTML = receiptHTML(sale,items,customer);
    const bar=h('div',{class:'flex flex-wrap justify-center gap-2 mt-5'});
    const bPrint=h('button',{class:btnP,onclick:()=>App.printReceipt(saleId)},'🖨 Print');
    const bWa=h('button',{class:btnS,onclick:()=>{
      const txt=[`*${settings().storeName||'Pharmacy'}*`,`Receipt: ${sale.id}`,`Date: ${fmtDateTime(sale.date)}`,'',
        ...items.map(it=>`${it.brand} (${it.level}×${it.qty}) — ${fmt(it.amount)}`),'',
        `Total: ${fmt(sale.total)}`,`Paid: ${fmt(sale.paid)}`,Number(sale.balance||0)>0?`Balance: ${fmt(sale.balance)}`:'',
        settings().receiptFooter||''].filter(Boolean).join('\n');
      waShare(customer.phone||'', txt);
    }},'💬 WhatsApp Bill');
    const bNew=h('button',{class:btnS,onclick:()=>m.close()},'New Sale');
    bar.append(bPrint,bWa,bNew); m.el.append(bar);
  }).catch(e=>{ m.el.innerHTML=`<div class="text-center text-red-500 py-6">${esc(e.message)}</div>`; });
}

/* global receipt printer — reused by sales module */
App.printReceipt = async (saleId)=>{

    const {sale,items,customer,doctor} = await API.call('getSale', saleId);
    printHTML(receiptHTML(sale,items,customer,doctor), 'Receipt '+saleId);

function custName(id){
  const c = state.customers.find(x=>x.id===id);
  return c ? c.name : 'Walk-in';
}

async function load(wrap){
  wrap.innerHTML = '<div class="bg-white rounded-xl border border-slate-200 p-10 text-center text-slate-400">Loading sales…</div>';
  try{
    const f = {from: state.from, to: state.to};
    if(state.q) f.q = state.q;
    if(state.customerId) f.customerId = state.customerId;
    state.sales = await API.call('listSales', f) || [];
    renderTable(wrap);
  }catch(e){
    wrap.innerHTML = `<div class="bg-white rounded-xl border border-slate-200 p-10 text-center">
      <p class="text-red-600 text-sm mb-3">Failed to load sales: ${esc(e.message||e)}</p>
      <button class="${btnS}" id="retryBtn">Retry</button></div>`;
    wrap.querySelector('#retryBtn').onclick = ()=>load(wrap);
  }
}

function renderTable(wrap){
  const cols = [
    {label:'Sale ID', get:r=>`<span class="font-mono font-medium text-slate-700">${esc(r.id)}</span>`},
    {label:'Date / Time', get:r=>fmtDateTime(r.date||r.createdAt)},
    {label:'Customer', get:r=>esc(custName(r.customerId))},
    {label:'Items', num:true, get:r=>fmtNum((r.items||[]).length || r.itemCount || 0)},
    {label:'Total', num:true, get:r=>`<span class="font-medium">${fmt(r.total)}</span>`},
    {label:'Paid', num:true, get:r=>fmt(r.paid)},
    {label:'Balance', num:true, get:r=>{
      const b = Number(r.balance)||0;
      return b>0 ? badge(fmt(b),'red') : '<span class="text-slate-400">—</span>';
    }},
    {label:'Status', get:r=>{
      const s = String(r.status||'completed').toLowerCase();
      const col = s==='completed'?'emerald':(s==='returned'||s==='partial-return')?'amber':'slate';
      return badge(s.replace(/-/g,' '), col);
    }},
    {label:'Actions', get:r=>`<button class="${btnS.replace('px-4','px-3').replace('py-2','py-1')}" data-view="${esc(r.id)}">View</button>`}
  ];
  wrap.innerHTML = tableHTML(cols, state.sales, {empty:'No sales found for the selected filters'});
  wrap.querySelectorAll('[data-view]').forEach(b=>{
    b.onclick = ()=>openSaleDetail(b.getAttribute('data-view'));
  });
}

/* ---------- sale detail modal ---------- */
async function openSaleDetail(id){
  const m = modal('Sale Detail', '<p class="text-slate-400 text-sm">Loading…</p>', {wide:true});
  try{
    const d = await API.call('getSale', id);
    const sale = d.sale, items = d.items||[], customer = d.customer||{}, returns = d.returns||[];
    const itemCount = items.reduce((a,i)=>a+(Number(i.qty)||0),0);

        <div><div class="text-xs text-slate-500 uppercase">Customer</div><div>${esc(customer.name||custName(sale.customerId))}${customer.phone?` <span class="text-slate-400">(${esc(customer.phone)})</span>`:''}</div></div>
        ${sale.doctorId?`<div><div class="text-xs text-slate-500 uppercase">Doctor</div><div>${esc(sale.doctorName||sale.doctorId)}</div></div>`:''}
        ${sale.delivery?`<div><div class="text-xs text-slate-500 uppercase">Delivery</div><div>${esc(sale.delivery.address||'')} <span class="text-slate-400">[${esc(sale.delivery.status||'pending')}]</span></div></div>`:''}
      </div>

      <h4 class="font-semibold text-sm mb-2">Items (${fmtNum(itemCount)})</h4>
      <div class="overflow-x-auto rounded-lg border border-slate-200 mb-4">

      </div>

      <div class="grid md:grid-cols-2 gap-4 mb-4">
        <div><h4 class="font-semibold text-sm mb-2">Payments</h4>
          <div class="overflow-x-auto rounded-lg border border-slate-200">
            <table class="w-full text-sm"><thead class="bg-slate-50 text-xs text-slate-500 uppercase">

function refreshList(){

/* ---------- sale return form ---------- */
function openReturnForm(sale, items, customer, done){
  if(!items.length){ toast('This sale has no items to return','warn'); return; }
  const m = modal('New Sale Return', `
    <p class="text-sm text-slate-500 mb-4">Sale <span class="font-mono font-semibold text-slate-700">${esc(sale.id)}</span> — enter return quantities (max = sold qty).</p>
    <div class="overflow-x-auto rounded-lg border border-slate-200 mb-4">
      <table class="w-full text-sm"><thead class="bg-slate-50 text-xs text-slate-500 uppercase">
        <tr><th class="px-3 py-2 text-left">Medicine</th><th class="px-3 py-2 text-right">Sold</th><th class="px-3 py-2 text-right">Return Qty</th></tr>
      </thead><tbody>
      ${items.map((it,i)=>`
        <tr class="border-t border-slate-100">
          <td class="px-3 py-2">${esc(it.brand||'')} <span class="text-slate-400 text-xs">[${esc(it.batchNo||it.batch||'')}]</span></td>
          <td class="px-3 py-2 text-right tabular-nums">${fmtNum(it.qty)}</td>
          <td class="px-3 py-2"><input type="number" name="rq_${i}" min="0" max="${Number(it.qty)||0}" step="1" value="0"
            class="border border-slate-300 rounded-lg px-2 py-1 w-24 text-sm text-right focus:ring-2 focus:ring-emerald-500 focus:outline-none"></td>
        </tr>`).join('')}
      </tbody></table></div>
    <div class="grid md:grid-cols-2 gap-3 mb-4">
      ${field('Restock to','restockTo',{type:'select',options:[{value:'batch',label:'Restock to batch'},{value:'damaged',label:'Move to damaged'}]})}
      ${field('Reason','reason',{ph:'e.g. expired pack / wrong medicine'})}
    </div>
    <div class="flex justify-end gap-2">
      <button class="${btnS}" id="rCancel">Cancel</button>
      <button class="${btnD}" id="rSave">Save Return</button>
    </div>`);
  m.el.querySelector('#rCancel').onclick = ()=>m.close();
  m.el.querySelector('#rSave').onclick = async ()=>{
    const retItems = [];
    items.forEach((it,i)=>{
      const q = formNum(m.el, 'rq_'+i);
      if(q>0) retItems.push({saleItemId: it.id||it.saleItemId||it._id, qty: q});
    });
    if(!retItems.length){ toast('Enter at least one return quantity','warn'); return; }
    const restockTo = formVal(m.el,'restockTo')||'batch';
    const reason = formVal(m.el,'reason');
    if(!await confirmDlg('Confirm return','Record return of '+retItems.length+' line(s)? Stock will be '+(restockTo==='damaged'?'moved to damaged':'restocked to batch')+'.','Save Return')) return;
    try{
      await API.call('saleReturn',{saleId:sale.id, items:retItems, restockTo, reason});
      toast('Return recorded','success');
      m.close(); if(typeof done==='function') done();
    }catch(e){ toast(e.message||'Return failed','error'); }
  };
}

/* ---------- collect dues ---------- */
function openCollectDues(sale, customer, done){
  const b = Session.bootstrap||{};
  const methods = (b.paymentMethods||[]).map(p=>({value:p.id||p.name, label:p.name}));
  if(!methods.length) methods.push({value:'cash',label:'Cash'});
  const m = modal('Collect Dues', `
    <p class="text-sm text-slate-500 mb-4">Customer <span class="font-semibold text-slate-700">${esc(customer.name||custName(sale.customerId))}</span>
    — outstanding balance <span class="font-semibold text-red-600">${fmt(sale.balance)}</span></p>
    <div class="grid md:grid-cols-2 gap-3 mb-4">
      ${field('Amount','amount',{type:'number',value:String(sale.balance),step:'0.01',min:0,max:Number(sale.balance),req:true})}
      ${field('Method','method',{type:'select',options:methods})}
      ${field('Date','date',{type:'date',value:todayISO(),req:true})}
      ${field('Notes','notes',{ph:'optional'})}
    </div>
    <div class="flex justify-end gap-2">
      <button class="${btnS}" id="dCancel">Cancel</button>
      <button class="${btnP}" id="dSave">Record Payment</button>
    </div>`);
  m.el.querySelector('#dCancel').onclick = ()=>m.close();
  m.el.querySelector('#dSave').onclick = async ()=>{
    const amount = formNum(m.el,'amount');
    if(amount<=0){ toast('Enter a valid amount','warn'); return; }
    if(amount>Number(sale.balance)+0.001){ toast('Amount cannot exceed balance','warn'); return; }
    try{
      await API.call('recordCustomerPayment',{
        customerId: sale.customerId, amount,
        method: formVal(m.el,'method'), date: formVal(m.el,'date')||todayISO(),
        notes: formVal(m.el,'notes')
      });
      toast('Payment recorded','success');
      m.close(); if(typeof done==='function') done();
    }catch(e){ toast(e.message||'Payment failed','error'); }
  };
}

})();


/* ===== 50_inventory.js ===== */
/* 50_inventory.js — Medicine master, batches, stock adjustments, alerts.
   Routes: #/inventory (Medicines | Batches tabs), #/alerts.
   Uses globals: App, API, perm, h/esc/fmt/fmtNum/fmtDate/daysUntil, toast,
   modal, confirmDlg, field, collectForm, tableHTML, statCard, pageHead,
   btnP, btnS, btnD, badge, debounce, dlCSV, printHTML. */
(function(){
'use strict';

/* ---------- nav ---------- */
App.nav.push({group:'STOCK', path:'#/inventory', label:'Inventory', icon:'inventory', perm:'inventory'});
App.nav.push({group:'STOCK', path:'#/alerts', label:'Stock Alerts', icon:'alerts', perm:'inventory'});

var FORMS=['Tablet','Capsule','Syrup','Injection','Cream','Drops','Inhaler','Other'];

function denyHTML(what){
  return '<div class="bg-white rounded-xl border border-slate-200 p-12 text-center text-slate-500">'
    +'<div class="text-4xl mb-3">🔒</div>'
    +'<p class="font-medium">You don\'t have permission to view '+esc(what)+'.</p></div>';
}
function spinnerHTML(){
  return '<div class="flex justify-center py-16"><div class="animate-spin rounded-full h-10 w-10 border-b-2 border-emerald-600"></div></div>';
}
function errHTML(msg){
  return '<div class="bg-white rounded-xl border border-red-200 p-10 text-center">'
    +'<p class="text-red-600 font-medium mb-3">Failed to load: '+esc(msg||'server error')+'</p>'
    +'<button class="'+btnS+'" onclick="location.hash=location.hash">Retry</button></div>';
}
function hashParam(name){
  var m=location.hash.match(new RegExp('[?&]'+name+'=([^&#]+)'));
  return m?decodeURIComponent(m[1]):null;
}

/* ---------- shared bits ---------- */
function expiryBadge(iso){
  if(!iso) return badge('No expiry','slate');
  var d=daysUntil(iso);
  var label=d<0?'Expired':(d===0?'Today':d+'d left');
  var color=d<0?'red':(d<=30?'red':(d<=90?'amber':'emerald'));
  return fmtDate(iso)+' '+badge(label,color);
}
function packLabel(m){
  var p=(m&&m.pack)||{};
  var parts=[];
  if(p.carton) parts.push('Carton:'+p.carton);
  if(p.box) parts.push('Box:'+p.box);
  if(p.packet) parts.push('Packet:'+p.packet);
  return parts.length?esc(parts.join(' · ')):'—';
}
function stockCell(m){
  var s=Number(m.stock)||0, r=Number(m.reorderLevel)||0;
  var low=s<=r;
  return '<span class="'+(low?'text-red-600 font-bold':'font-medium tabular-nums')+'">'+fmtNum(s)+'</span>'
    +(low?'<div class="text-[10px] text-red-500 mt-0.5">low (reorder ≤ '+fmtNum(r)+')</div>':'');
}

/* =====================================================================
   #/inventory
===================================================================== */
App.routes['#/inventory']=async function(el,params){
  if(!perm('inventory','view')){ el.innerHTML=denyHTML('Inventory'); return; }
  var state={tab:'medicines',q:'',filter:'all',meds:[],bq:'',batches:[],batchesLoaded:false};
  el.innerHTML=
    '<div class="inline-flex gap-1 bg-white rounded-xl border border-slate-200 p-1 mb-5">'
    +'<button data-tab="medicines" class="px-5 py-2 rounded-lg text-sm font-medium">Medicines</button>'
    +'<button data-tab="batches" class="px-5 py-2 rounded-lg text-sm font-medium">Batches</button>'
    +'</div>'
    +'<div id="tabMedicines"></div><div id="tabBatches" class="hidden"></div>';

  var tabBtns=el.querySelectorAll('[data-tab]');
  function paintTabs(){
    tabBtns.forEach(function(b){
      var on=b.getAttribute('data-tab')===state.tab;
      b.className='px-5 py-2 rounded-lg text-sm font-medium '+(on?'bg-emerald-600 text-white':'text-slate-600 hover:bg-slate-100');
    });
    el.querySelector('#tabMedicines').classList.toggle('hidden',state.tab!=='medicines');
    el.querySelector('#tabBatches').classList.toggle('hidden',state.tab!=='batches');
  }
  tabBtns.forEach(function(b){
    b.onclick=function(){
      state.tab=b.getAttribute('data-tab'); paintTabs();
      if(state.tab==='batches'&&!state.batchesLoaded) loadAllBatches();
    };
  });
  paintTabs();

  renderMedicinesTab(el.querySelector('#tabMedicines'),state);
  renderBatchesTab(el.querySelector('#tabBatches'),state);
  await loadMedicines(state);

  var medId=(params&&params.med)||hashParam('med');
  if(medId){
    var med=state.meds.find(function(m){return String(m.id)===String(medId);});
    openBatchesModal(medId,med?med.brand:'Medicine');
  }
};

/* ---------- Medicines tab ---------- */
function renderMedicinesTab(root,state){
  var canCreate=perm('inventory','create');
  root.innerHTML=
    pageHead('Inventory','Medicine master, batches and stock control',
      (canCreate?'<button class="'+btnP+'" id="btnAddMed">+ Add Medicine</button>':'')
      +(canCreate?'<button class="'+btnS+'" id="btnImportMed">Import CSV</button>':'')
      +'<button class="'+btnS+'" id="btnExportMed">Export CSV</button>')
    +'<div class="bg-white rounded-xl border border-slate-200 shadow-sm p-4 mb-4 flex flex-wrap gap-3 items-center">'
    +'<input id="medSearch" type="text" placeholder="Search brand, generic, manufacturer…" '
    +'class="border border-slate-300 rounded-lg px-3 py-2 w-full sm:w-80 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">'
    +'<select id="medFilter" class="border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none">'
    +'<option value="all">All medicines</option><option value="low">Low stock</option><option value="controlled">Controlled</option>'
    +'</select><span id="medCount" class="text-xs text-slate-500 ml-auto"></span></div>'
    +'<div id="medTableWrap">'+spinnerHTML()+'</div>'
    +'<input type="file" id="csvFile" accept=".csv" class="hidden">';

  var search=root.querySelector('#medSearch');
  search.addEventListener('input',debounce(function(){state.q=search.value;loadMedicines(state);},300));
  root.querySelector('#medFilter').addEventListener('change',function(){state.filter=this.value;loadMedicines(state);});
  var addBtn=root.querySelector('#btnAddMed');
  if(addBtn) addBtn.onclick=function(){openMedModal(null,state);};
  var impBtn=root.querySelector('#btnImportMed');
  if(impBtn) impBtn.onclick=function(){root.querySelector('#csvFile').click();};
  root.querySelector('#csvFile').addEventListener('change',function(){importCSV(this,state);});
  root.querySelector('#btnExportMed').onclick=function(){exportMedicines(state);};
}

async function loadMedicines(state){
  var wrap=document.getElementById('medTableWrap');
  if(!wrap) return;
  wrap.innerHTML=spinnerHTML();
  try{
    var list=await API.call('listMedicines',state.q||'',{});
    if(!Array.isArray(list)) list=[];
    if(state.filter==='low') list=list.filter(function(m){return (Number(m.stock)||0)<=(Number(m.reorderLevel)||0);});
    if(state.filter==='controlled') list=list.filter(function(m){return !!m.controlled;});
    state.meds=list;
    var cnt=document.getElementById('medCount');
    if(cnt) cnt.textContent=list.length+' medicine'+(list.length===1?'':'s');

    var cols=[
      {label:'Brand',get:function(m){var b=(m.controlled?badge('Controlled','violet')+' ':'')+(m.rxRequired?badge('Rx','blue'):'');
        return '<div class="font-medium">'+esc(m.brand)+'</div>'+(b?'<div class="mt-1 space-x-1">'+b+'</div>':'');}},
      {label:'Generic',get:function(m){return esc(m.generic||'—');}},
      {label:'Strength',get:function(m){return esc(m.strength||'—');}},
      {label:'Form',get:function(m){return esc(m.form||'—');}},
      {label:'Mfg',get:function(m){return esc(m.manufacturer||'—');}},
      {label:'Stock (units)',get:stockCell},
      {label:'Pack levels',get:packLabel},
      {label:'Rack',get:function(m){return esc(m.rack||'—');}},
      {label:'Actions',get:function(m){
        var a='<button class="'+btnS+' !px-3 !py-1 !text-xs" data-act="batches" data-id="'+esc(m.id)+'">Batches</button>';
        if(perm('inventory','edit')) a+=' <button class="'+btnS+' !px-3 !py-1 !text-xs" data-act="edit" data-id="'+esc(m.id)+'">Edit</button>';
        if(perm('inventory','delete')) a+=' <button class="'+btnD+' !px-3 !py-1 !text-xs" data-act="del" data-id="'+esc(m.id)+'">Delete</button>';
        return '<div class="flex gap-1.5 flex-wrap">'+a+'</div>';
      }}
    ];
    wrap.innerHTML=tableHTML(cols,state.meds,{empty:'No medicines found'});
    wrap.querySelectorAll('[data-act]').forEach(function(b){
      b.onclick=function(){
        var id=b.getAttribute('data-id');
        var med=state.meds.find(function(m){return String(m.id)===String(id);});
        var act=b.getAttribute('data-act');
        if(act==='batches') openBatchesModal(id,med?med.brand:'Medicine');
        else if(act==='edit'&&med) openMedModal(med,state);
        else if(act==='del'&&med) delMedicine(med,state);
      };
    });
  }catch(e){ wrap.innerHTML=errHTML(e.message); }
}

/* ---------- Add / Edit medicine modal ---------- */
function openMedModal(med,state){
  var isEdit=!!med;
  var v=function(k,d){return med?(med[k]??d):d;};
  var pk=(med&&med.pack)||{};
  var m=modal(isEdit?'Edit Medicine — '+med.brand:'Add Medicine',
    '<div class="grid grid-cols-1 md:grid-cols-2 gap-4">'
    +field('Brand name','brand',{req:true,value:v('brand',''),ph:'e.g. Panadol'})
    +field('Generic','generic',{value:v('generic',''),ph:'e.g. Paracetamol'})
    +field('Manufacturer','manufacturer',{value:v('manufacturer','')})

    +field('Dosage form','form',{type:'select',value:v('form','Tablet'),options:FORMS.map(function(f){return{value:f,label:f};})})
    +field('HSN code','hsn',{value:v('hsn','')})
    +field('GST %','gst',{type:'number',value:v('gst',0),step:'0.01',min:0})
    +field('Rack location','rack',{value:v('rack',''),ph:'e.g. A-12'})
    +field('Storage conditions','storage',{value:v('storage',''),ph:'e.g. Cool, dry place'})
    +field('Reorder level (units)','reorderLevel',{type:'number',value:v('reorderLevel',10),min:0})
    +field('Controlled substance','controlled',{type:'checkbox',value:!!v('controlled',false)})
    +field('Prescription required','rxRequired',{type:'checkbox',value:!!v('rxRequired',false)})
    +'</div>'
    +'<div class="mt-4 pt-4 border-t border-slate-200"><div class="text-xs font-semibold text-slate-600 uppercase mb-3">Pack levels — units per pack</div>'
    +'<div class="grid grid-cols-3 gap-4">'
    +field('Units / carton','carton',{type:'number',value:pk.carton||0,min:0})
    +field('Units / box','box',{type:'number',value:pk.box||0,min:0})
    +field('Units / packet','packet',{type:'number',value:pk.packet||0,min:0})
    +'</div></div>'
    +'<div class="flex justify-end gap-2 mt-6"><button id="mCancel" class="'+btnS+'">Cancel</button>'
    +'<button id="mSave" class="'+btnP+'">'+(isEdit?'Save changes':'Add medicine')+'</button></div>',
    {wide:true});

  m.el.querySelector('#mCancel').onclick=m.close;
  m.el.querySelector('#mSave').onclick=async function(){
    var f=collectForm(m.el);
    if(!f.brand){toast('Brand name is required','error');return;}

/* ---------- CSV import / export ---------- */
function splitCSVLine(line){
  var out=[],cur='',q=false;
  for(var i=0;i<line.length;i++){
    var c=line[i];
    if(q){
      if(c==='"'){ if(line[i+1]==='"'){cur+='"';i++;} else q=false; }
      else cur+=c;
    }else if(c==='"') q=true;
    else if(c===','){out.push(cur);cur='';}
    else cur+=c;
  }
  out.push(cur); return out;
}
function parseCSV(text){
  var lines=String(text).split(/\r?\n/);
  var head=null,rows=[];
  lines.forEach(function(line){
    if(!line.trim()) return;
    var cells=splitCSVLine(line).map(function(s){return s.trim();});
    if(!head){head=cells.map(function(s){return s.toLowerCase();});return;}
    var o={};
    head.forEach(function(k,j){o[k]=cells[j]!==undefined?cells[j]:'';});
    rows.push(o);
  });
  return rows;
}
function normImportRow(r){
  var num=function(v){var n=Number(String(v||'').replace(/,/g,''));return isNaN(n)?0:n;};
  var bool=function(v){return /^(1|true|yes|y)$/i.test(String(v||'').trim());};
  return{
    brand:r.brand||'', generic:r.generic||'', manufacturer:r.manufacturer||'',
    strength:r.strength||'', form:r.form||'Tablet', hsn:r.hsn||'',
    gst:num(r.gst), rack:r.rack||'', controlled:bool(r.controlled),
    storage:r.storage||'', reorderLevel:num(r.reorderLevel),
    rxRequired:bool(r.rxRequired),
    pack:{carton:num(r.carton), box:num(r.box), packet:num(r.packet)}
  };
}
function importCSV(input,state){
  var file=input.files&&input.files[0];
  input.value='';
  if(!file) return;
  var rd=new FileReader();
  rd.onload=async function(){
    try{
      var rows=parseCSV(rd.result).map(normImportRow).filter(function(r){return r.brand;});
      if(!rows.length){toast('No valid rows found in CSV','warn');return;}
      var res=await API.call('importMedicines',rows);
      toast('Import done — added '+(res.added||0)+', updated '+(res.updated||0),'success');
      if(res.errors&&res.errors.length){
        modal('Import errors — '+res.errors.length+' row(s)',
          '<ul class="text-sm text-red-600 space-y-1 list-disc pl-5 max-h-80 overflow-y-auto">'
          +res.errors.map(function(e){return '<li>'+esc(e)+'</li>';}).join('')+'</ul>');
      }
      loadMedicines(state);
    }catch(e){toast(e.message,'error');}
  };
  rd.onerror=function(){toast('Could not read file','error');};
  rd.readAsText(file);
}
function exportMedicines(state){
  var rows=state.meds.map(function(m){
    var p=m.pack||{};
    return{brand:m.brand||'',generic:m.generic||'',manufacturer:m.manufacturer||'',
      strength:m.strength||'',form:m.form||'',hsn:m.hsn||'',gst:m.gst||0,
      rack:m.rack||'',controlled:m.controlled?'yes':'no',storage:m.storage||'',
      reorderLevel:m.reorderLevel||0,rxRequired:m.rxRequired?'yes':'no',
      carton:p.carton||0,box:p.box||0,packet:p.packet||0};
  });
  dlCSV('medicines.csv',rows);
}

      const counts=await Promise.all(pos.map(p=>API.call('getPO',p.id).then(r=>((r&&r.items)||[]).length).catch(()=>0)));
      body.querySelector('#poCount').textContent=pos.length+' purchase order'+(pos.length===1?'':'s');
      tbl.innerHTML=tableHTML([
        {label:'PO ID',get:r=>`<span class="font-mono text-xs">${esc(r.id)}</span>`},
        {label:'Date',get:r=>fmtDate(r.date)},
        {label:'Supplier',get:r=>esc(r.supplier||'—')},
        {label:'Items',num:true,get:(r,i)=>fmtNum(counts[i])},
        {label:'Total',num:true,get:r=>`<span class="font-semibold">${fmt(r.total)}</span>`},

    </div>
  `,{wide:true});
  const root=m.el;
  const onDoc=(e)=>{ if(!root.contains(e.target)) root.querySelectorAll('.med-dd').forEach(d=>d.classList.add('hidden')); };
  document.addEventListener('click',onDoc);
  const origClose=m.close; m.close=()=>{ document.removeEventListener('click',onDoc); origClose(); };

  const lines=root.querySelector('#poLines');
  const upd=()=>{
    let t=0;
    lines.querySelectorAll('.po-line').forEach(L=>{
      const q=Number(L.querySelector('.l-qty').value)||0, r=Number(L.querySelector('.l-rate').value)||0;
      L.querySelector('.l-amt').textContent=fmt(q*r); t+=q*r;
    });
    root.querySelector('#poTot').textContent=fmt(t);
  };
  const addLine=()=>{
    const L=document.createElement('div');
    L.className='po-line grid grid-cols-12 gap-2 items-end bg-slate-50 border border-slate-200 rounded-lg p-2';
    L.innerHTML=`
      <div class="col-span-12 md:col-span-5">${medPickerHTML()}</div>
      <div class="col-span-4 md:col-span-2"><span class="block text-xs font-medium text-slate-600 mb-1">Qty</span><input type="number" min="0" step="1" class="l-qty border border-slate-300 rounded-lg px-3 py-2 w-full text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none"></div>
      <div class="col-span-4 md:col-span-2"><span class="block text-xs font-medium text-slate-600 mb-1">Rate</span><input type="number" min="0" step="0.01" class="l-rate border border-slate-300 rounded-lg px-3 py-2 w-full text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none"></div>
