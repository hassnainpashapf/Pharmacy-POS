    L.querySelector('.l-del').onclick=()=>{ L.remove(); upd(); };
    L.addEventListener('input',upd);
    lines.append(L);
    wireMedPicker(L.querySelector('.med-pick'));
  };
  root.querySelector('#poAdd').onclick=addLine;
  root.querySelector('#poCancel').onclick=()=>m.close();
  const saveBtn=root.querySelector('#poSave');
  saveBtn.onclick=async()=>{
    const supplierId=formVal(root,'supplierId');
    const items=[];
    lines.querySelectorAll('.po-line').forEach(L=>{
      const mid=L.querySelector('.med-id').value;
      const qty=Number(L.querySelector('.l-qty').value)||0, rate=Number(L.querySelector('.l-rate').value)||0;
      if(mid&&qty>0) items.push({medicineId:mid,qty,rate});
    });
    if(!supplierId){ toast('Select a supplier','warn'); return; }
    if(!items.length){ toast('Add at least one order line (medicine + qty)','warn'); return; }
    saveBtn.disabled=true; saveBtn.textContent='Saving…';
    try{
      const id=await API.call('savePO',{supplierId,date:formVal(root,'date')||todayISO(),status:formVal(root,'status'),notes:formVal(root,'notes'),items});
      toast('Purchase order '+id+' saved','success'); m.close(); if(purRefresh) purRefresh();
    }catch(e){ toast(e.message,'error'); }
    saveBtn.disabled=false; saveBtn.textContent='Save PO';
  };
  addLine();
}

          <div>
            <div class="text-lg font-bold font-mono">${esc(po.id)}</div>
            <div class="text-sm text-slate-500">${esc(supName)} · ${fmtDate(po.date)}</div>

          {label:'Qty',num:true,get:r=>fmtNum(r.qty)},
          {label:'Rate',num:true,get:r=>fmt(r.rate)},

          <div class="space-y-1">${grns.map(g=>`<div class="text-xs bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 flex justify-between gap-2"><span><span class="font-mono">${esc(g.id)}</span> · ${fmtDate(g.date)}${g.invoiceNo?' · Inv '+esc(g.invoiceNo):''}</span><span class="font-semibold shrink-0">${fmt(g.total)}</span></div>`).join('')}</div></div>`:''}

          ${(['ordered','partial','quotation'].includes(po.status)&&perm('purchases','create'))?`<button id="poGrn" class="${btnP}">Receive Stock (GRN)</button>`:''}
        </div>`;
      const marks=root.querySelector('#poMarks');
      if(perm('purchases','edit')){
        marks.innerHTML=PO_STATUSES.filter(s=>s[0]!==po.status).map(s=>`<button data-st="${s[0]}" class="${btnS} !py-1.5 !text-xs">${s[1]}</button>`).join('');
        marks.querySelectorAll('button').forEach(b=>b.onclick=async()=>{
          b.disabled=true;
          try{ await API.call('setPOStatus',po.id,b.dataset.st); toast('PO marked as '+b.dataset.st,'success'); m.close(); if(purRefresh) purRefresh(); }
          catch(e){ toast(e.message,'error'); b.disabled=false; }
        });
      }else marks.innerHTML='<span class="text-xs text-slate-400">No permission to change status</span>';
      const grnBtn=root.querySelector('#poGrn'); if(grnBtn) grnBtn.onclick=()=>{ m.close(); openGRN(po,items); };
    }catch(e){ root.innerHTML=errHTML(e.message); wireRetry(root,load); }
  };

}

/* ---------- GRN modal (receive stock) ---------- */
function openGRN(po,items){
  if(!perm('purchases','create')){ toast('Not allowed','error'); return; }
  const m=modal('Receive GRN — '+po.id,`
    <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-4">
      ${field('Invoice No','invoiceNo',{ph:'Supplier invoice #'})}
      ${field('Date','date',{type:'date',value:todayISO()})}
      ${field('Other charges','charges',{type:'number',step:'0.01',value:0})}
    </div>
    <label class="flex items-center gap-2 text-sm mb-3"><input type="checkbox" name="partial" class="w-4 h-4 accent-emerald-600"><span class="text-slate-600">Partial receive — keep PO open for the remaining stock</span></label>
    <div class="hidden md:grid grid-cols-12 gap-2 text-xs font-semibold text-slate-500 uppercase mb-1 px-2">
      <div class="col-span-3">Medicine</div><div class="col-span-1">Qty*</div><div class="col-span-2">Batch No*</div><div class="col-span-1">MFG</div><div class="col-span-2">Expiry*</div><div class="col-span-1">Cost*</div><div class="col-span-2">MRP*</div>
    </div>
    <div id="grnLines" class="space-y-2 mb-4">
      ${items.map(it=>`
      <div class="grn-line grid grid-cols-12 gap-2 items-center bg-slate-50 border border-slate-200 rounded-lg p-2" data-mid="${esc(it.medicineId)}">
        <div class="col-span-12 md:col-span-3 text-sm font-medium">${esc(it.brand)}<div class="text-xs text-slate-400 font-normal">Ordered: ${fmtNum(it.qty)}</div></div>
        <div class="col-span-3 md:col-span-1"><input type="number" min="0" step="1" value="${esc(String(it.qty))}" class="g-qty border border-slate-300 rounded-lg px-2 py-1.5 w-full text-sm" placeholder="Qty"></div>
        <div class="col-span-9 md:col-span-2"><input class="g-batch border border-slate-300 rounded-lg px-2 py-1.5 w-full text-sm" placeholder="Batch no"></div>
        <div class="col-span-4 md:col-span-1"><input type="date" class="g-mfg border border-slate-300 rounded-lg px-2 py-1.5 w-full text-sm"></div>
        <div class="col-span-8 md:col-span-2"><input type="date" class="g-exp border border-slate-300 rounded-lg px-2 py-1.5 w-full text-sm"></div>
        <div class="col-span-6 md:col-span-1"><input type="number" min="0" step="0.01" value="${esc(String(it.rate))}" class="g-cost border border-slate-300 rounded-lg px-2 py-1.5 w-full text-sm" placeholder="Cost"></div>
        <div class="col-span-6 md:col-span-2"><input type="number" min="0" step="0.01" class="g-mrp border border-slate-300 rounded-lg px-2 py-1.5 w-full text-sm" placeholder="MRP"></div>
      </div>`).join('')}
    </div>
    <div class="flex justify-end gap-2">
      <button id="grnCancel" class="${btnS}">Cancel</button>
      <button id="grnSave" class="${btnP}">Receive stock</button>
    </div>
  `,{wide:true});
  const root=m.el;
  root.querySelector('#grnCancel').onclick=()=>m.close();
  const saveBtn=root.querySelector('#grnSave');
  saveBtn.onclick=async()=>{
    const its=[]; let bad=false;
    root.querySelectorAll('.grn-line').forEach(L=>{
      L.classList.remove('ring-2','ring-red-400');
      const qty=Number(L.querySelector('.g-qty').value)||0;
      if(qty<=0) return; // skipped line → partial receive
      const batchNo=L.querySelector('.g-batch').value.trim(), exp=L.querySelector('.g-exp').value,
            cost=Number(L.querySelector('.g-cost').value)||0, mrp=Number(L.querySelector('.g-mrp').value)||0;
      if(!batchNo||!exp||cost<=0||mrp<=0){ bad=true; L.classList.add('ring-2','ring-red-400'); return; }
      its.push({medicineId:L.dataset.mid,batchNo,mfg:L.querySelector('.g-mfg').value,expiry:exp,cost,mrp,qty});
    });
    if(bad){ toast('Fill Batch No, Expiry, Cost and MRP for every received line','warn'); return; }
    if(!its.length){ toast('Nothing to receive — set qty > 0 on at least one line','warn'); return; }
    saveBtn.disabled=true; saveBtn.textContent='Receiving…';
    try{
      await API.call('receiveGRN',{poId:po.id,invoiceNo:formVal(root,'invoiceNo'),date:formVal(root,'date')||todayISO(),charges:formNum(root,'charges'),partial:root.querySelector('[name="partial"]').checked,items:its});
      toast('Stock received — batches created','success'); m.close(); if(purRefresh) purRefresh();
    }catch(e){ toast(e.message,'error'); saveBtn.disabled=false; saveBtn.textContent='Receive stock'; }
  };
}

  const lines=root.querySelector('#rtLines');

  const wireBatchPicker=(L)=>{
    const q=L.querySelector('.b-q'), bid=L.querySelector('.b-id'), bmid=L.querySelector('.b-mid'),
          dd=L.querySelector('.b-dd'), info=L.querySelector('.b-info'), qty=L.querySelector('.b-qty');
    const search=debounce(async()=>{
      const s=q.value.trim(); if(s.length<1){ dd.classList.add('hidden'); return; }
      try{
        const bs=await API.call('listBatches','');
        const f=bs.filter(b=>((b.batchNo||'')+' '+(b.brand||'')+' '+(b.generic||'')).toLowerCase().includes(s.toLowerCase())&&Number(b.qty)>0).slice(0,10);

        dd.querySelectorAll('button[data-id]').forEach(x=>x.onclick=(ev)=>{ ev.stopPropagation();
          bid.value=x.dataset.id; bmid.value=x.dataset.mid; q.value=x.dataset.label;
          qty.max=x.dataset.qty; qty.value=x.dataset.qty;
          info.textContent='Available: '+fmtNum(x.dataset.qty)+' units';
          dd.classList.add('hidden');
        });
      }catch(e){ dd.classList.add('hidden'); }
    },250);
    q.addEventListener('input',()=>{ bid.value=''; bmid.value=''; info.textContent=''; search(); });
    q.addEventListener('focus',search); q.addEventListener('click',e=>e.stopPropagation());
  };

  const addLine=()=>{
    const L=document.createElement('div');
    L.className='rt-line grid grid-cols-12 gap-2 items-end bg-slate-50 border border-slate-200 rounded-lg p-2';
    L.innerHTML=`
      <div class="col-span-12 md:col-span-7">

        </div>
        <div class="b-info text-xs text-slate-500 mt-1"></div>
      </div>
      <div class="col-span-10 md:col-span-4"><span class="block text-xs font-medium text-slate-600 mb-1">Qty</span>

      <div class="col-span-2 md:col-span-1 text-right"><button type="button" class="b-del text-red-500 hover:text-red-700 text-xl leading-none" title="Remove line">×</button></div>`;
    L.querySelector('.b-del').onclick=()=>L.remove();
    lines.append(L);
    wireBatchPicker(L);
  };
  root.querySelector('#rtAdd').onclick=addLine;
  root.querySelector('#rtCancel').onclick=()=>m.close();
  const saveBtn=root.querySelector('#rtSave');
  saveBtn.onclick=async()=>{
    const supplierId=formVal(root,'supplierId');
    const items=[];
    lines.querySelectorAll('.rt-line').forEach(L=>{
      const bid=L.querySelector('.b-id').value, mid=L.querySelector('.b-mid').value;
      const qty=Number(L.querySelector('.b-qty').value)||0;
      if(bid&&mid&&qty>0) items.push({batchId:bid,medicineId:mid,qty});
    });
    if(!supplierId){ toast('Select a supplier','warn'); return; }
    if(!items.length){ toast('Add at least one return line (batch + qty)','warn'); return; }
    saveBtn.disabled=true; saveBtn.textContent='Saving…';
    try{
      await API.call('savePurchaseReturn',{supplierId,date:formVal(root,'date')||todayISO(),notes:formVal(root,'notes'),items});
      toast('Purchase return saved','success'); m.close(); if(purRefresh) purRefresh();
    }catch(e){ toast(e.message,'error'); }
    saveBtn.disabled=false; saveBtn.textContent='Save return';
  };
  addLine();
}

function openSupplierForm(sup){
  if(!perm('suppliers',sup?'edit':'create')){ toast('Not allowed','error'); return; }
  const m=modal(sup?'Edit Supplier':'Add Supplier',`
    ${field('Name','name',{req:true,value:sup?sup.name:'',ph:'Supplier name'})}
    <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mt-3">
      ${field('Phone','phone',{value:sup?(sup.phone||''):'',ph:'03xx-xxxxxxx'})}

      <button id="spSave" class="${btnP}">${sup?'Save changes':'Add supplier'}</button>
    </div>`);
  const root=m.el;
  root.querySelector('#spCancel').onclick=()=>m.close();

async function delSupplier(id,sup){
  if(!perm('suppliers','delete')){ toast('Not allowed','error'); return; }
  if(!await confirmDlg('Delete supplier',`Delete <b>${esc(sup?sup.name:id)}</b>? This cannot be undone.`,'Delete')) return;
  try{ await API.call('deleteSupplier',id); toast('Supplier deleted','success'); if(supRefresh) supRefresh(); }
  catch(e){ toast(e.message,'error'); }
}

/* ---------- supplier ledger ---------- */
async function openLedger(id){
  const m=modal('Supplier Ledger',`<div class="py-8 text-center text-slate-400 text-sm">Loading…</div>`,{wide:true});
  const root=m.el;
  const load=async()=>{
    try{
      const res=await API.call('getSupplierLedger',id);
      const supplier=res.supplier, ents=(res.entries||[]).slice();
      const bal=Number(supplier.balance)||0;
      let sub=0; const run=ents.map(x=>{ const r=bal-sub; sub+=Number(x.amount)||0; return r; });
      root.innerHTML=`
        <div class="flex flex-wrap items-start justify-between gap-3 mb-4 bg-slate-50 border border-slate-200 rounded-xl p-4">
          <div>
            <div class="text-lg font-bold text-slate-800">${esc(supplier.name)}</div>
            <div class="text-sm text-slate-500">${esc(supplier.phone||'—')}${supplier.address?' · '+esc(supplier.address):''}</div>
          </div>
          <div class="text-right"><div class="text-xs text-slate-500 uppercase">Balance payable</div>
            <div class="text-2xl font-bold ${bal>0?'text-red-600':'text-slate-700'}">${fmt(bal)}</div></div>
        </div>
        <div class="flex justify-end mb-3">${perm('suppliers','create')?`<button id="lgPay" class="${btnP} !py-1.5">Record Payment</button>`:''}</div>
        ${tableHTML([
          {label:'Date',get:r=>fmtDate(r.date)},
          {label:'Ref',get:r=>`<span class="font-mono text-xs">${esc(r.ref||'')}</span>`},
          {label:'Description',get:r=>esc(r.desc||'')},
          {label:'Amount',num:true,get:r=>Number(r.amount)>=0
            ?`<span class="text-red-600">+${fmt(r.amount)}</span>`
            :`<span class="text-emerald-600">−${fmt(Math.abs(r.amount))}</span>`},
          {label:'Balance',num:true,get:(r,i)=>`<span class="font-semibold">${fmt(run[i])}</span>`}
        ],ents,{empty:'No ledger entries yet'})}`;
      const pb=root.querySelector('#lgPay'); if(pb) pb.onclick=()=>openSupplierPayment(supplier,load);
    }catch(e){ root.innerHTML=errHTML(e.message); wireRetry(root,load); }
  };
  await load();
}

/* ---------- record supplier payment ---------- */
function openSupplierPayment(supplier,afterLoad){
  if(!perm('suppliers','create')){ toast('Not allowed','error'); return; }
  const pms=(Session.bootstrap&&Session.bootstrap.paymentMethods)||[];
  const opts=pms.length?pms.map(p=>({value:p.name,label:p.name})):[{value:'Cash',label:'Cash'}];
  const m=modal('Record Payment — '+supplier.name,`
    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
      ${field('Amount','amount',{type:'number',step:'0.01',req:true,ph:'0.00'})}
      ${field('Date','date',{type:'date',value:todayISO()})}
    </div>
    <div class="mt-3">${field('Payment method','method',{type:'select',options:opts})}</div>
    <div class="mt-3">${field('Notes','notes',{type:'textarea',rows:2,ph:'Optional notes…'})}</div>
    <div class="flex justify-end gap-2 mt-5">
      <button id="pyCancel" class="${btnS}">Cancel</button>
      <button id="pySave" class="${btnP}">Save payment</button>
    </div>`);
  const root=m.el;
  root.querySelector('#pyCancel').onclick=()=>m.close();
  const sv=root.querySelector('#pySave');
  sv.onclick=async()=>{
    const amount=formNum(root,'amount');
    if(amount<=0){ toast('Enter a valid amount','warn'); return; }
    sv.disabled=true; sv.textContent='Saving…';
    try{
      await API.call('recordSupplierPayment',{supplierId:supplier.id,amount,method:formVal(root,'method'),date:formVal(root,'date')||todayISO(),notes:formVal(root,'notes')});
      toast('Payment recorded','success'); m.close();
      if(afterLoad) afterLoad(); if(supRefresh) supRefresh();
    }catch(e){ toast(e.message,'error'); }
    sv.disabled=false; sv.textContent='Save payment';
  };
}

})();

function customerModal(cust){

      ${field('Membership Card No','membershipCard',{value:cust.membershipCard||''})}
      <div class="sm:col-span-2">${field('Address','address',{value:cust.address||''})}</div>
      ${field('Credit Limit (Rs)','creditLimit',{type:'number',min:0,step:'0.01',value:cust.creditLimit||0})}
      <div class="sm:col-span-2">${field('Allergies','allergies',{type:'textarea',rows:2,value:cust.allergies||'',ph:'Known medicine allergies'})}</div>
      <div class="sm:col-span-2">${field('Medical Notes','notes',{type:'textarea',rows:2,value:cust.notes||''})}</div>
      <div class="sm:col-span-2 flex justify-end gap-2 mt-2">
        <button type="button" class="${btnS}" id="cCancel">Cancel</button>
        <button type="submit" class="${btnP}" id="cSave">Save Customer</button>
      </div></form>`);
  m.el.querySelector('#cCancel').onclick=()=>m.close();
  m.el.querySelector('#cForm').addEventListener('submit',async e=>{

    const v=collectForm(m.el.querySelector('#cForm'));

    if(cust.id) v.id=cust.id;
    const btn=m.el.querySelector('#cSave'); btn.disabled=true; btn.textContent='Saving…';
    try{ await API.call('saveCustomer',v); toast('Customer saved','success'); m.close(); m.onSaved&&m.onSaved(); }
    catch(err){ toast(err.message||'Save failed','error'); btn.disabled=false; btn.textContent='Save Customer'; }
  });

async function collectDuesModal(customer,onDone){
  const bal=Number(customer.balance||0);
  const m=modal('Collect Dues',`
    <form id="payForm" class="grid grid-cols-1 gap-4">
      ${statCard('Outstanding Balance',fmt(bal),'','red')}
      ${field('Amount (Rs)','amount',{type:'number',min:0.01,max:bal,step:'0.01',value:bal,req:true})}
      ${field('Payment Method','method',{type:'select',options:payMethods().map(p=>({value:p.id,label:p.name}))})}
      ${field('Date','date',{type:'date',value:todayISO(),req:true})}
      ${field('Notes','notes',{type:'textarea',rows:2})}
      <div class="flex justify-end gap-2 mt-1">
        <button type="button" class="${btnS}" id="payCancel">Cancel</button>
        <button type="submit" class="${btnP}" id="paySave">Record Payment</button>
      </div></form>`);
  m.el.querySelector('#payCancel').onclick=()=>m.close();
  m.el.querySelector('#payForm').addEventListener('submit',async e=>{
    e.preventDefault();
    const v=collectForm(m.el.querySelector('#payForm'));
    if(!v.amount||v.amount<=0){ toast('Enter a valid amount','error'); return; }
    if(v.amount>bal){ toast('Amount exceeds balance','error'); return; }
    const btn=m.el.querySelector('#paySave'); btn.disabled=true; btn.textContent='Recording…';
    try{
      await API.call('recordCustomerPayment',{customerId:customer.id,amount:v.amount,method:v.method,date:v.date,notes:v.notes});
      toast('Payment recorded','success'); m.close(); onDone&&onDone();
    }catch(err){ toast(err.message||'Payment failed','error'); btn.disabled=false; btn.textContent='Record Payment'; }
  });
}

            {label:'Date',get:r=>fmtDateTime(r.date)},

App.routes['#/customers']=async(el)=>{
  if(!perm('customers','view')){ el.innerHTML=deniedHTML('Customers'); return; }
  const canCreate=perm('customers','create'), canEdit=perm('customers','edit'), canDel=perm('customers','delete');
  let q='';
  el.innerHTML=pageHead('Customers','Customer profiles, loyalty, credit & dues',
      canCreate?`<button class="${btnP}" id="cAdd">+ Add Customer</button>`:'')
    +searchCard(searchInput('cSearch','Search name or phone…'),'cTbl');
  const tbl=el.querySelector('#cTbl'), input=el.querySelector('#cSearch');
  const load=async()=>{
    tbl.innerHTML=loadingHTML();
    try{
      const rows=await API.call('listCustomers',q);
      tbl.innerHTML=tableHTML([
        {label:'Name',get:r=>`<span class="font-medium text-slate-800">${esc(r.name)}</span>${r.allergies?'<div class="text-xs text-amber-600">⚠ allergies noted</div>':''}`},
        {label:'Phone',get:r=>esc(r.phone||'—')},
        {label:'Membership Card',get:r=>esc(r.membershipCard||'—')},
        {label:'Loyalty Points',get:r=>`<span class="font-semibold text-violet-700">${fmtNum(r.loyaltyPoints||0)}</span>`,num:true},
        {label:'Balance',get:r=>{const b=Number(r.balance||0);return b>0?`<span class="text-red-600 font-semibold">${fmt(b)}</span>`:fmt(0);},num:true},
        {label:'Credit Limit',get:r=>fmt(r.creditLimit||0),num:true},
        {label:'Actions',get:r=>{
          let a=`<button class="${iconBtn}" data-act="hist" data-id="${esc(r.id)}" title="History">📜</button> `;
          if(r.phone) a+=`<button class="${iconBtn}" data-act="wa" data-id="${esc(r.id)}" data-phone="${esc(r.phone)}" data-name="${esc(r.name)}" data-bal="${Number(r.balance||0)}" title="WhatsApp">💬</button> `;
          if(canEdit) a+=`<button class="${iconBtn}" data-act="edit" data-id="${esc(r.id)}" title="Edit">✏️</button> `;
          if(canDel) a+=`<button class="${iconBtn}" data-act="del" data-id="${esc(r.id)}" title="Delete">🗑️</button>`;
          return a;
        }}
      ],rows,{empty:'No customers found. Add your first customer to get started.'});
      tbl._rows=rows;
    }catch(e){ tbl.innerHTML=errorHTML(e.message||'Failed to load customers'); }
  };
  input.addEventListener('input',debounce(()=>{q=input.value.trim();load();}));
  if(canCreate) el.querySelector('#cAdd').onclick=()=>{ const m=customerModal(); m.onSaved=load; };
  tbl.addEventListener('click',async e=>{
    const b=e.target.closest('[data-act]'); if(!b) return;
    const act=b.dataset.act, id=b.dataset.id;
    if(act==='retry'){ load(); return; }
    if(act==='hist'){ customerHistoryModal(id); return; }
    if(act==='wa'){
      waShare(b.dataset.phone,`Hello ${b.dataset.name}, your current pharmacy dues balance: ${fmt(Number(b.dataset.bal||0))}. Thank you!`);
      return;
    }
    if(act==='edit'){
      const c=(tbl._rows||[]).find(x=>x.id===id);
      const m=customerModal(c||{id}); m.onSaved=load; return;
    }
    if(act==='del'){
      if(await confirmDlg('Delete customer','Delete this customer? (Blocked if sales history exists.)')) {
        try{ await API.call('deleteCustomer',id); toast('Customer deleted','success'); load(); }
        catch(err){ toast(err.message||'Delete failed','error'); }
      }
    }
  });
  await load();
};

})();

    try{
      const emps=await API.call('listEmployees');
      data.innerHTML=tableHTML([
        {label:'Name',get:e=>`<span class="font-medium">${esc(e.name)}</span>`},
        {label:'Role',get:e=>esc(e.role||'—')},
        {label:'Phone',get:e=>esc(e.phone||'—')},

          </div>`}]:[])
      ],emps,{empty:'No employees yet — add your first staff member.'});

function employeeModal(emp,reload){
  const m=modal(emp?'Edit Employee':'Add Employee',`
    <div class="space-y-4">
      <div class="grid grid-cols-2 gap-4">
        ${field('Name','name',{value:emp?emp.name:'',req:true,ph:'Full name'})}
        ${field('Role','role',{value:emp?emp.role:'',ph:'e.g. Pharmacist'})}
      </div>
      <div class="grid grid-cols-2 gap-4">
        ${field('Phone','phone',{value:emp?emp.phone:'',ph:'03xx-xxxxxxx'})}
        ${field('Monthly Salary','salary',{type:'number',step:'0.01',min:'0',value:emp?emp.salary:'',req:true,ph:'0.00'})}
      </div>
      ${emp?field('Active','active',{type:'checkbox',value:emp.active}):''}
      <div class="flex justify-end gap-2">
        <button id="emCancel" class="${btnS}">Cancel</button>
        <button id="emSave" class="${btnP}">Save</button>
      </div>
    </div>`);
  m.el.querySelector('#emCancel').onclick=m.close;
  const saveBtn=m.el.querySelector('#emSave');
  saveBtn.onclick=async()=>{
    const d=collectForm(m.el);
    if(!d.name){ toast('Name is required','warn'); return; }
    if(!(Number(d.salary)>0)){ toast('Enter a salary greater than 0','warn'); return; }
    saveBtn.disabled=true; saveBtn.textContent='Saving…';
    try{
      await API.call('saveEmployee',{id:emp?emp.id:undefined,name:d.name,role:d.role,phone:d.phone,salary:Number(d.salary),active:emp?!!d.active:true});
      toast('Employee saved','success'); m.close(); reload();
    }catch(e){ toast(e.message||'Save failed','error'); saveBtn.disabled=false; saveBtn.textContent='Save'; }
  };
}

function advanceModal(emp,reload){
  const m=modal(`Record Advance — ${esc(emp.name)}`,`
    <div class="space-y-4">
      <div class="grid grid-cols-2 gap-4">
        ${field('Amount (Rs)','amount',{type:'number',step:'0.01',min:'0',req:true,ph:'0.00'})}
        ${field('Date','date',{type:'date',value:todayISO(),req:true})}
      </div>
      ${field('Notes','notes',{type:'textarea',rows:2,ph:'Optional notes'})}
      <div class="flex justify-end gap-2">
        <button id="adCancel" class="${btnS}">Cancel</button>
        <button id="adSave" class="${btnP}">Record Advance</button>
      </div>
    </div>`);
  m.el.querySelector('#adCancel').onclick=m.close;
  const saveBtn=m.el.querySelector('#adSave');
  saveBtn.onclick=async()=>{
    const amount=formNum(m.el,'amount'), date=formVal(m.el,'date'), notes=formVal(m.el,'notes');
    if(!(amount>0)){ toast('Enter an amount greater than 0','warn'); return; }
    if(!date){ toast('Pick a date','warn'); return; }
    saveBtn.disabled=true; saveBtn.textContent='Saving…';
    try{
      await API.call('recordAdvance',{employeeId:emp.id,amount,date,notes});
      toast('Advance recorded','success'); m.close(); reload();
    }catch(e){ toast(e.message||'Save failed','error'); saveBtn.disabled=false; saveBtn.textContent='Record Advance'; }
  };
}

/* ---- Payroll generation & pay ---- */
async function payrollTab(body){
  const canCreate=perm('payroll','create'), canEdit=perm('payroll','edit');
  body.innerHTML=
    `<div class="flex items-center justify-between flex-wrap gap-3 mb-4">
       <h2 class="text-lg font-semibold text-slate-800">Monthly Payroll</h2>
       <div class="flex items-center gap-2 flex-wrap">
         <input type="month" id="prMonth" value="${monthISO()}" class="border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
         ${canCreate?`<button id="prGen" class="${btnP}">Generate Payroll</button>`:''}
       </div>
     </div><div id="prData"></div>`;
  const data=body.querySelector('#prData');
  async function load(){
    const m=body.querySelector('#prMonth').value;
    data.innerHTML=loadingHTML();
    try{
      const rows=await API.call('listPayroll',m);
      const total=rows.reduce((s,r)=>s+Number(r.net||0),0);
      const paid=rows.filter(r=>r.paid).reduce((s,r)=>s+Number(r.net||0),0);
      data.innerHTML=
        `<div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-4">
           ${statCard('Payroll · '+fmtMonth(m),fmt(total),rows.length+' employees','slate')}
           ${statCard('Paid',fmt(paid),'this month','emerald')}
           ${statCard('Unpaid',fmt(total-paid),'pending','amber')}
         </div>`
        +tableHTML([
          {label:'Employee',get:r=>`<span class="font-medium">${esc(r.employee||'—')}</span>`},
          {label:'Month',get:r=>fmtMonth(r.month)},
          {label:'Salary',num:true,get:r=>fmt(r.salary)},
          {label:'Advances',num:true,get:r=>fmt(r.advances)},
          {label:'Net Payable',num:true,get:r=>`<span class="font-semibold">${fmt(r.net)}</span>`},
          {label:'Status',get:r=>r.paid?badge('Paid','emerald'):badge('Unpaid','amber')},
          ...(canEdit?[{label:'Action',get:r=>r.paid?'':`<button class="${btnP}" style="padding:.25rem .75rem" data-pay="${esc(r.id)}">Mark Paid</button>`}]:[])
        ],rows,{empty:'No payroll generated for '+fmtMonth(m)+' — click Generate Payroll.'});
      data.querySelectorAll('[data-pay]').forEach(btn=>btn.onclick=()=>markPaid(btn.dataset.pay,load));
    }catch(e){ data.innerHTML=errHTML(e); }
  }
  body.querySelector('#prMonth').addEventListener('change',load);
  const gen=body.querySelector('#prGen');
  if(gen) gen.onclick=async()=>{
    const m=body.querySelector('#prMonth').value;
    if(!m){ toast('Pick a month first','warn'); return; }
    const ok=await confirmDlg('Generate Payroll',
      `Generate payroll for <b>${esc(fmtMonth(m))}</b>?<br><span class="text-slate-500">Net payable = basic salary minus recorded advances, for all active employees.</span>`,'Generate');
    if(!ok) return;
    try{
      await API.call('generatePayroll',{month:m});
      toast('Payroll generated for '+fmtMonth(m),'success');
    }catch(e){
      const msg=e.message||'Generation failed';
      toast(/already/i.test(msg)?msg:'Generation failed: '+msg,/already/i.test(msg)?'warn':'error');
    }
    load();
  };
  await load();
}

async function markPaid(id,reload){
  const ok=await confirmDlg('Mark as Paid',
    'Mark this salary as <b>paid</b>? It will also be booked as a Salary expense in Accounting.','Mark Paid');
  if(!ok) return;
  try{
    await API.call('markPayrollPaid',id);
    toast('Salary marked as paid','success'); reload();
  }catch(e){ toast(e.message||'Failed','error'); }
}

})();

let _chart = null;
function destroyChart(){ if(_chart){ try{_chart.destroy();}catch(e){} _chart=null; } }

const MONEY_KEYS = ['amount','total','value','cost','balance','charges','mrp','paid','net','rate','price','discount','due'];
const QTY_KEYS   = ['qty','units','count','transactions'];
const DATE_KEYS  = ['date','expiry','mfg','validTill'];
const KEY_LABELS = {label:'Group', brand:'Brand', batch:'Batch', batchNo:'Batch No', expiry:'Expiry',
  mfg:'Mfg Date', grn:'GRN', po:'PO', supplier:'Supplier', invoice:'Invoice #', date:'Date',
  daysLeft:'Days Left', name:'Name', phone:'Phone', cost:'Cost', value:'Value', mrp:'MRP',
  qty:'Qty', units:'Units', amount:'Amount', total:'Total', charges:'Charges', balance:'Balance',
  username:'Username', role:'Role'};
function keyLabel(k){ return KEY_LABELS[k] || (k.charAt(0).toUpperCase()+k.slice(1)); }
function cellVal(k, v){
  if(v==null || v==='') return '—';
  if(DATE_KEYS.includes(k)) return esc(fmtDate(v));
  if(MONEY_KEYS.includes(k)) return esc(fmt(Number(v)));
  if(QTY_KEYS.includes(k)) return esc(fmtNum(Number(v)));
  return esc(String(v));
}
function autoCols(rows, moneyRight=true){
  if(!rows.length) return [];
  return Object.keys(rows[0]).map(k=>({
    label:keyLabel(k), num:(MONEY_KEYS.includes(k)||QTY_KEYS.includes(k))&&moneyRight,
    get:r=>{ if(k==='daysLeft'){ const d=Number(r.daysLeft);
        return d<0?`<span class="text-red-600 font-semibold">Expired ${d} d</span>`
          :`<span class="${d<=30?'text-amber-600 font-semibold':'text-slate-600'}">${d} days</span>`; }
      return cellVal(k, r[k]); }
  }));
}
function barCfg(labels, data, label, color){
  return {type:'bar',
    data:{labels, datasets:[{label:label||'', data, backgroundColor:color||'#059669', borderRadius:4}]},
    options:{responsive:true, maintainAspectRatio:false,
      plugins:{legend:{display:!!label}},
      scales:{y:{beginAtZero:true, ticks:{precision:0}}, x:{ticks:{maxRotation:45, minRotation:0}}}}};
}
function donutCfg(labels, data){
  const cols=['#059669','#0ea5e9','#f59e0b','#ef4444','#8b5cf6','#64748b'];
  return {type:'doughnut',
    data:{labels, datasets:[{data, backgroundColor:labels.map((_,i)=>cols[i%cols.length])}]},
    options:{responsive:true, maintainAspectRatio:false, cutout:'55%',
      plugins:{legend:{position:'right'}}}};
}
function drawChart(cfg){
  destroyChart();

  if(!cv) return;
  if(typeof window.Chart==='undefined'){ cv.outerHTML='<p class="text-sm text-slate-400 p-4">Chart unavailable</p>'; return; }
  try{ window.Chart.defaults.font.family='Inter, sans-serif'; }catch(e){}
  _chart = new window.Chart(cv.getContext('2d'), cfg);
}
function firstKey(rows){ return rows.length?Object.keys(rows[0])[0]:null; }

      return {cards, chartCfg, cols, rows, csv};
    }},
  inventory:{ title:'Inventory Valuation', file:'inventory', needs:[],
    run: async () => API.call('reportInventory'),
    view(d){
      const rows=d.rows||[];
      const cards=[ statCard('Stock Value (Cost)', fmt(d.totalValue),'','emerald'),
                    statCard('MRP Value', fmt(d.totalMRP),'','blue'),
                    statCard('Batches', fmtNum(rows.length),'in stock','slate') ];
      const top=[...rows].sort((a,b)=>b.value-a.value).slice(0,10);
      const chartCfg=barCfg(top.map(r=>r.brand+' · '+r.batch), top.map(r=>Number(r.value)||0),'Batch value','#8b5cf6');
      const cols=autoCols(rows);
      const csv=rows.map(r=>({Brand:r.brand,Batch:r.batch,Expiry:String(r.expiry).slice(0,10),Qty:r.qty,Cost:Number(r.cost).toFixed(2),Value:Number(r.value).toFixed(2),MRP:Number(r.mrp).toFixed(2)}));
      return {cards, chartCfg, cols, rows, csv};
    }},
  expiry:{ title:'Expiry Alert Report', file:'expiry', needs:['days'],
    run: async p => API.call('reportExpiry', Number(p.days)),
    view(d, p){
      const rows=Array.isArray(d)?d:(d.rows||[]);
      const expired=rows.filter(r=>Number(r.daysLeft)<0);
      const cards=[ statCard('Items', fmtNum(rows.length),`within ${p.days} days`,'amber'),
                    statCard('Already Expired', fmtNum(expired.length),'','red'),
                    statCard('Total Qty', fmtNum(rows.reduce((s,r)=>s+Number(r.qty||0),0)),'','slate') ];
      const bk=[['Expired',0],['0–30 days',0],['31–60 days',0],['61–90 days',0],['90+ days',0]];
      rows.forEach(r=>{const dl=Number(r.daysLeft);
        if(dl<0)bk[0][1]++; else if(dl<=30)bk[1][1]++; else if(dl<=60)bk[2][1]++; else if(dl<=90)bk[3][1]++; else bk[4][1]++;});
      const chartCfg=barCfg(bk.map(x=>x[0]), bk.map(x=>x[1]),'Items','#f59e0b');
      const cols=autoCols(rows);
      const k=firstKey(rows);
      const csv=rows.map(r=>{const o={}; (k?Object.keys(rows[0]):[]).forEach(key=>{o[keyLabel(key)]=DATE_KEYS.includes(key)?String(r[key]).slice(0,10):r[key];}); return o;});
      return {cards, chartCfg, cols, rows, csv};
    }},
  fastmovers:{ title:'Fast Movers', file:'fastmovers', needs:['from','to'],
    run: async p => API.call('reportFastMovers', {from:p.from, to:p.to, limit:20}),
    view(d){
      const rows=Array.isArray(d)?d:(d.rows||[]);
      const cards=[ statCard('Medicines', fmtNum(rows.length),'top sellers','emerald'),
                    statCard('Total Units', fmtNum(rows.reduce((s,r)=>s+Number(r.units||0),0)),'','blue'),
                    statCard('Total Amount', fmt(rows.reduce((s,r)=>s+Number(r.amount||0),0)),'','slate') ];
      const top=rows.slice(0,10);
      const chartCfg=barCfg(top.map(r=>r.brand), top.map(r=>Number(r.units)||0),'Units sold');
      const cols=[{label:'Medicine',get:r=>esc(r.brand)},
                  {label:'Units Sold',num:true,get:r=>fmtNum(r.units)},
                  {label:'Amount',num:true,get:r=>fmt(r.amount)}];
      const csv=rows.map(r=>({Medicine:r.brand,Units:r.units,Amount:Number(r.amount).toFixed(2)}));
      return {cards, chartCfg, cols, rows, csv};
    }},
  dues:{ title:'Dues Report', file:'dues', needs:[],
    run: async () => API.call('reportDues'),
    view(d){
      const cu=d.customers||[], su=d.suppliers||[];
      const ct=cu.reduce((s,r)=>s+Number(r.balance||0),0), st=su.reduce((s,r)=>s+Number(r.balance||0),0);
      const cards=[ statCard('Customer Dues', fmt(ct), fmtNum(cu.length)+' customers','amber'),
                    statCard('Supplier Dues', fmt(st), fmtNum(su.length)+' suppliers','red'),
                    statCard('Net Position', fmt(ct-st),'receivable − payable','slate') ];
      const chartCfg=donutCfg(['Customer dues','Supplier dues'],[ct,st]);
      const cols=[{label:'Name',get:r=>esc(r.name)},{label:'Phone',get:r=>esc(r.phone||'—')},
                  {label:'Balance',num:true,get:r=>fmt(r.balance)}];
      const csv=cu.map(r=>({Type:'Customer',Name:r.name,Phone:r.phone||'',Balance:Number(r.balance).toFixed(2)}))
        .concat(su.map(r=>({Type:'Supplier',Name:r.name,Phone:r.phone||'',Balance:Number(r.balance).toFixed(2)})));
      return {cards, chartCfg, cols, rows:cu, rows2:su, csv, dual:true};
    }}
};

    }finally{ q('#rRun').disabled=false; }

};

const roleBadge=r=>badge(r[0].toUpperCase()+r.slice(1),
  r==='admin'?'violet':r==='manager'?'blue':r==='pharmacist'?'amber':'slate');

function userModal(u){
  const isNew=!u || !u.id;
  const m=modal(isNew?'Add User':'Edit User',`
    ${field('Full Name','name',{value:u?u.name:'',req:true,ph:'e.g. Ahmed Khan'})}
    <div class="mt-3">${field('Username','username',{value:u?u.username:'',req:true,ph:'login username'})}</div>
    <div class="mt-3">${field(isNew?'Password':'New Password (blank = keep)','password',{type:'password',req:isNew,ph:isNew?'min 6 chars':'leave blank to keep'})}</div>
    <div class="mt-3">${field('Role','role',{type:'select',value:u?u.role:'cashier',
      options:ROLES.map(r=>({value:r,label:r[0].toUpperCase()+r.slice(1)}))})}</div>
    <div class="flex justify-end gap-2 mt-6">
      <button class="${btnS}" id="uCancel">Cancel</button>
      <button class="${btnP}" id="uSave">Save User</button>
    </div>`);
  m.el.querySelector('#uCancel').onclick=()=>m.close();
  m.el.querySelector('#uSave').onclick=async ()=>{
    const name=formVal(m.el,'name'), username=formVal(m.el,'username'),
          password=m.el.querySelector('[name=password]').value, role=formVal(m.el,'role');
    if(!name||!username){ toast('Name and username are required','warn'); return; }
    if(isNew&&(!password||password.length<6)){ toast('Password must be at least 6 characters','warn'); return; }
    const btn=m.el.querySelector('#uSave'); btn.disabled=true; btn.textContent='Saving…';
    try{
      const payload={name, username, role};
      if(u&&u.id) payload.id=u.id;
      if(password) payload.password=password;
      await API.call('saveUser', payload);
      toast(isNew?'User created':'User updated','success');
      m.close(); loadUsers();
    }catch(e){ toast(e.message||'Save failed','error'); btn.disabled=false; btn.textContent='Save User'; }
  };
}

async function loadUsers(){
  const host=document.getElementById('uTable');
  if(!host) return;
  const canEdit=perm('users','edit');
  host.innerHTML=spinner('Loading users…');
  try{
    const users=await API.call('listUsers');
    host.innerHTML=tableHTML([
      {label:'Name', get:u=>`<span class="font-medium">${esc(u.name)}</span>`},
      {label:'Username', get:u=>esc(u.username)},
      {label:'Role', get:u=>roleBadge(u.role||'cashier')},
      {label:'Active', get:u=>`<button class="uToggle" data-id="${esc(u.id)}" data-a="${u.active?0:1}" ${canEdit?'':'disabled'}>
          ${u.active?badge('Active','emerald'):badge('Inactive','slate')}</button>`},
      {label:'Actions', get:u=>canEdit?`<button class="${btnS} !px-3 !py-1 uEdit" data-id="${esc(u.id)}">Edit</button>`:'<span class="text-slate-300">—</span>'}
    ], users, {empty:'No users found'});
    host.querySelectorAll('.uEdit').forEach(b=>b.onclick=()=>{
      const u=users.find(x=>x.id===b.dataset.id); if(u) userModal(u);
    });
    host.querySelectorAll('.uToggle').forEach(b=>b.onclick=async ()=>{
      try{ await API.call('toggleUser', b.dataset.id, b.dataset.a==='1');
        toast(b.dataset.a==='1'?'User activated':'User deactivated','success'); loadUsers();
      }catch(e){ toast(e.message||'Toggle failed','error'); }
    });
  }catch(e){ host.innerHTML=errBox(e.message||'Could not load users', true);
    const r=host.querySelector('#errRetry'); if(r) r.onclick=loadUsers; }
}

function normMatrix(arr){
  const out={};
  ROLES.forEach(role=>{
    const entry=(arr||[]).find(e=>e.role===role);
    const mx=(entry&&entry.matrix)||{};
    out[role]={};
    MODULES.forEach(mod=>{
      const cell=mx[mod]||{};
      out[role][mod]={view:!!cell.view, create:!!cell.create, edit:!!cell.edit, delete:!!cell.delete};
    });
  });
  return out;
}

async function loadMatrix(){
  const host=document.getElementById('pMat');
  if(!host) return;
  const canEdit=perm('users','edit');
  host.innerHTML=spinner('Loading permission matrix…');
  try{
    const raw=await API.call('getPermissions');
    const mx=normMatrix(raw);
    host.innerHTML=`
      <table class="w-full text-sm">
        <thead class="bg-slate-50 text-slate-500 uppercase text-xs sticky top-0">
          <tr><th class="px-3 py-3 text-left font-semibold sticky left-0 bg-slate-50">Module</th>
          ${ROLES.map(r=>`<th class="px-3 py-3 text-center font-semibold">${r[0].toUpperCase()+r.slice(1)}${r==='admin'?' 🔒':''}</th>`).join('')}</tr>
        </thead>
        <tbody>${MODULES.map(mod=>`<tr class="border-t border-slate-100 hover:bg-slate-50">
          <td class="px-3 py-2 font-medium text-slate-700 sticky left-0 bg-white">${esc(mod)}</td>
          ${ROLES.map(role=>{
            const locked=role==='admin';
            return `<td class="px-2 py-2 text-center"><div class="inline-flex gap-2 justify-center">
              ${ACTIONS.map(a=>`<label class="inline-flex items-center gap-0.5 text-[11px] text-slate-500" title="${a}">
                <input type="checkbox" class="w-3.5 h-3.5 accent-emerald-600" data-role="${role}" data-mod="${mod}" data-act="${a}"
                  ${mx[role][mod][a]?'checked':''} ${locked||!canEdit?'disabled':''}>
                ${ACT_LABEL[a]}</label>`).join('')}
            </div></td>`;
          }).join('')}</tr>`).join('')}</tbody>
      </table>
      <div class="flex items-center justify-between mt-4">
        <p class="text-xs text-slate-400">V = View · C = Create · E = Edit · D = Delete. Admin column is locked (full access).</p>
        ${canEdit?`<button class="${btnP}" id="pSave">Save Permissions</button>`:''}
      </div>`;
    const saveBtn=host.querySelector('#pSave');
    if(saveBtn) saveBtn.onclick=async ()=>{
      const payload=ROLES.map(role=>{
        const matrix={};
        MODULES.forEach(mod=>{ matrix[mod]={};
          ACTIONS.forEach(a=>{
            if(role==='admin'){ matrix[mod][a]=true; return; }
            const cb=host.querySelector(`input[data-role="${role}"][data-mod="${mod}"][data-act="${a}"]`);
            matrix[mod][a]=!!(cb&&cb.checked);
          });
        });
        return {role, matrix};
      });
      saveBtn.disabled=true; saveBtn.textContent='Saving…';
      try{
        await API.call('savePermissions', payload);
        Session.bootstrap=null;
        Session.bootstrap=await API.call('getBootstrap');
        toast('Permissions saved','success');
      }catch(e){ toast(e.message||'Save failed','error'); }
      finally{ saveBtn.disabled=false; saveBtn.textContent='Save Permissions'; }
    };
  }catch(e){ host.innerHTML=errBox(e.message||'Could not load permissions', true);
    const r=host.querySelector('#errRetry'); if(r) r.onclick=loadMatrix; }
}

        toast('Settings saved','success');
      }catch(e){ toast(e.message||'Save failed','error'); }
      finally{ saveBtn.disabled=false; saveBtn.textContent='Save Settings'; }
    };
  }catch(e){
    el.innerHTML = pageHead('Settings','') + errBox(e.message||'Could not load settings', true);
    const r=el.querySelector('#errRetry'); if(r) r.onclick=()=>App.routes['#/settings'](el);
  }
};

/* ================= AI ASSISTANT ================= */
const aiHistory=[];

function aiBubble(role, text, thinking){
  const isUser=role==='user';
  return `<div class="flex ${isUser?'justify-end':'justify-start'} mb-3">
    <div class="max-w-[85%] md:max-w-[70%] px-4 py-2.5 rounded-2xl text-sm leading-relaxed
      ${isUser?'bg-emerald-600 text-white rounded-br-md':'bg-white border border-slate-200 text-slate-700 rounded-bl-md shadow-sm'}">
      ${thinking?'<span class="animate-pulse">Thinking…</span>':esc(text).replace(/\n/g,'<br>')}
    </div></div>`;
}
function renderAi(){
  const box=document.getElementById('aiMsgs');
  if(!box) return;
  box.innerHTML = aiHistory.length
    ? aiHistory.map(m=>aiBubble(m.role, m.text, m.thinking)).join('')
    : `<div class="text-center text-slate-400 text-sm py-10">Ask about sales, stock, expiry, dues…<br>e.g. "What expires this month?"</div>`;
  box.scrollTop=box.scrollHeight;
}

App.routes['#/ai'] = async function(el){
  if(!perm('ai')){ noAccess(el,'ai'); return; }
  el.innerHTML = pageHead('AI Assistant','Ask plain-English questions about your store data')
    + `<div class="bg-blue-50 border border-blue-200 rounded-xl p-4 mb-4 text-sm text-blue-800">
        💡 Configure an AI key in <b>Settings → AI</b> for live answers — demo mode shows store stats.
      </div>
      <div class="bg-white rounded-xl border border-slate-200 shadow-sm flex flex-col" style="height:calc(100vh - 340px);min-height:420px">
        <div id="aiMsgs" class="flex-1 overflow-y-auto p-4 bg-slate-50 rounded-t-xl"></div>
        <div class="p-3 border-t border-slate-200 flex gap-2">
          <input id="aiInput" placeholder="Ask about sales, stock, expiry, dues…" autocomplete="off"
            class="border border-slate-300 rounded-lg px-3 py-2 w-full text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
          <button class="${btnP}" id="aiSend">Send</button>
        </div>
      </div>`;
  renderAi();
  const input=el.querySelector('#aiInput'), sendBtn=el.querySelector('#aiSend');
  async function send(){
    const q=input.value.trim();
    if(!q) return;
    input.value=''; input.focus();
    aiHistory.push({role:'user', text:q});
    aiHistory.push({role:'assistant', thinking:true});
    renderAi();
    try{
      const r=await API.call('aiAsk', q);
      const t=aiHistory[aiHistory.length-1];
      t.thinking=false; t.text=(r&&r.answer)||'No answer returned.';
    }catch(e){
      const t=aiHistory[aiHistory.length-1];
      t.thinking=false; t.text='Error: '+(e.message||'AI request failed');
    }
    renderAi();
  }
  sendBtn.onclick=send;
  input.onkeydown=e=>{ if(e.key==='Enter') send(); };
};

})();

</script>
